<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ケアマネ業務ナビ | 入退所タスク管理</title>
<style>
  :root{
    --paper:#F4F5F1;
    --surface:#FFFFFF;
    --surface-alt:#F6F8F5;
    --ink:#20251F;
    --ink-muted:#5F665C;
    --border:#DCE3D9;
    --teal:#2F5D55;
    --teal-dark:#1F3F39;
    --teal-soft:#DCE6DE;
    --clay:#9C5B43;
    --clay-soft:#F1E1D8;
    --gold:#8A6A2B;
    --gold-soft:#F3EBD6;
    --danger:#A23B32;
    --danger-soft:#F3DCD8;
    --done:#8A9189;
    --radius:12px;
    --shadow:0 1px 2px rgba(32,37,31,.06), 0 6px 18px rgba(32,37,31,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    line-height:1.6; min-height:100vh; font-size:15px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  #app{max-width:1180px; margin:0 auto; padding:24px 18px 64px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:20px; padding:20px clamp(16px,3vw,28px); background:#224d45; border-radius:16px; color:#fff;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:40px; height:40px; border-radius:10px; background:#42695d; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-title{font-weight:800; font-size:clamp(20px,3vw,26px); letter-spacing:.02em;}
  .brand-sub{font-size:12.5px; color:#dfebe5;}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{border:none; border-radius:9px; padding:10px 16px; font-weight:700; font-size:14px; transition:transform .12s, background .12s;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:#fff; color:var(--teal-dark); border:1.5px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-danger{background:var(--danger); color:#fff;}
  .topbar .btn{background:#fafaf1; color:#21473c; border:0;}
  .topbar .btn.btn-sub{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.45);}
  .topbar .btn.btn-sub:hover{background:rgba(255,255,255,.1);}
  .notice-count{display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; border-radius:999px; background:#E9B9A9; color:#5A2416; font-size:12px; line-height:20px; text-align:center;}
  .btn-text{background:none; border:0; color:var(--ink-muted); font-weight:600; padding:6px 4px; font-size:13px;}
  .btn-text:hover{color:var(--teal-dark);}
  .btn-danger-text{background:none; border:0; color:var(--danger); font-weight:600; padding:4px 6px; font-size:13px;}

  /* ---------- Form ---------- */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:18px; box-shadow:var(--shadow);}
  .section-title{font-size:18px; color:var(--teal-dark); margin:0 0 12px;}
  .field-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px;}
  .field{flex:1; min-width:180px;}
  .field label{display:block; font-size:13px; font-weight:700; color:var(--ink-muted); margin-bottom:5px;}
  .field select{width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; color:var(--ink); background:var(--surface-alt);}
  .field input{width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; color:var(--ink); background:var(--surface-alt);}
  .field input:focus{border-color:var(--teal); background:#fff;}
  .hint{font-size:13px; color:var(--ink-muted); margin-top:6px;}
  .form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:10px;}
  .form-error{color:var(--danger); font-size:13px; font-weight:700; min-height:1.2em; margin-top:6px;}

  /* ---------- Summary / tabs ---------- */
  .summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:0 0 20px;}
  .metric{display:flex; align-items:center; justify-content:space-between; gap:6px; background:#fff; border:1px solid var(--border); border-top:4px solid #738d7c; border-radius:12px; padding:14px 18px; text-align:left; color:var(--teal-dark); font-size:14px; font-weight:700;}
  .metric strong{font-size:28px; line-height:1.2; font-variant-numeric:tabular-nums;}
  .metric small{font-size:12px; margin-left:3px;}
  .metric[data-status=overdue]{border-top-color:var(--danger);}
  .metric[data-status=overdue] strong{color:var(--danger);}
  .metric[data-status=soon]{border-top-color:#b68b4b;}
  .metric[data-status=soon] strong{color:var(--clay);}
  .metric:hover{background:#eaf0e8;}
  .tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1.5px solid var(--border);}
  .tab-btn{background:none; border:none; padding:10px 14px; font-size:14px; font-weight:700; color:var(--ink-muted); border-bottom:2.5px solid transparent; margin-bottom:-1.5px;}
  .tab-btn.active{color:var(--teal-dark); border-bottom-color:var(--teal); background:#e4ece4; border-radius:8px 8px 0 0;}

  /* ---------- Floor / CM filter ---------- */
  .scope-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin:0 0 16px;}
  .scope-bar label{font-size:13px; font-weight:700; color:var(--ink-muted); display:flex; align-items:center; gap:6px;}
  .scope-bar select{padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; background:var(--surface-alt); color:var(--ink); min-width:9em;}
  .scope-note{font-size:12.5px; color:var(--ink-muted); margin-left:auto;}
  .scope-on{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-soft);}
  .floor-head{display:flex; align-items:baseline; gap:10px; margin:18px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--teal-soft);}
  .floor-head:first-child{margin-top:0;}
  .floor-head h3{margin:0; font-size:16px; color:var(--teal-dark);}
  .floor-head span{font-size:12.5px; color:var(--ink-muted);}
  .rc-staff{display:flex; gap:6px; flex-wrap:wrap;}
  .staff-chip{font-size:12px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--surface-alt); border:1px solid var(--border); color:var(--ink-muted);}
  .staff-chip.cm{background:#E6EEF3; border-color:#C9D9E3; color:#2D5870;}
  .staff-chip.none{color:#A0A69D; font-weight:600;}
  .mx-sub{display:block; font-size:11px; color:var(--ink-muted); font-weight:600;}

  /* ---------- Resident cards ---------- */
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-muted); border:1.5px dashed var(--border); border-radius:14px; background:#fff;}
  .empty-state strong{display:block; font-size:16px; color:var(--teal-dark); margin-bottom:6px;}
  .resident-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}
  .resident-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); transition:transform .12s; display:flex; flex-direction:column; gap:10px; text-align:left; color:inherit; font:inherit;}
  .resident-card:hover{transform:translateY(-2px);}
  .rc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .rc-name{font-weight:800; font-size:17px; color:var(--teal-dark); overflow-wrap:anywhere;}
  .rc-alert{font-size:12.5px; font-weight:700; color:var(--danger);}
  .phase-badge,.tt-phase-tag{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .phase-pre{background:var(--teal-soft); color:var(--teal-dark);}
  .phase-adm{background:var(--clay-soft); color:var(--clay);}
  .phase-stay{background:#E8EEEC; color:var(--teal-dark);}
  .phase-predis{background:var(--clay-soft); color:var(--clay);}
  .phase-postdis{background:#EDEAE4; color:var(--ink-muted);}
  .rc-dates{font-size:13px; color:var(--ink-muted);}
  .progress-track{height:8px; border-radius:999px; background:var(--surface-alt); overflow:hidden; border:1px solid var(--border);}
  .progress-fill{height:100%; background:var(--teal); border-radius:999px;}
  .rc-foot{font-size:12.5px; color:var(--ink-muted);}
  .rc-next{font-size:13px; color:var(--ink);}
  .rc-next b{color:var(--clay);}

  /* ---------- Kind tags ---------- */
  .kind-tag{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:6px; margin-right:6px; vertical-align:1px; white-space:nowrap;}
  .kind-kazan{background:var(--gold-soft); color:var(--gold);}
  .kind-shihyo{background:#E1ECF2; color:#2D5870;}
  .kind-custom{background:#ECECEC; color:#555;}

  /* ---------- Detail view ---------- */
  .detail-header{padding:22px; background:#fff; border:1px solid var(--border); border-radius:14px; margin-bottom:16px;}
  .detail-name-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .detail-name{font-size:22px; font-weight:800; color:var(--teal-dark);}
  .meta-grid{display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; align-items:flex-end;}
  .meta-item{font-size:14px;}
  .meta-item span{display:block; color:var(--ink-muted); font-size:12px; font-weight:700; margin-bottom:3px;}
  .meta-item select{width:10.5em; padding:6px 8px; border:1.5px solid var(--border); border-radius:7px; font-size:14px; background:var(--surface-alt); color:var(--ink);}
  .meta-item input{width:10.5em; padding:6px 8px; border:1.5px solid var(--border); border-radius:7px; font-size:14px; background:var(--surface-alt);}

  .timeline{display:flex; align-items:flex-start; margin:20px 0 24px; overflow-x:auto; padding:5px 0 4px;}
  .tl-node{display:flex; flex-direction:column; align-items:center; flex:1; min-width:80px; position:relative;}
  .tl-dot{width:18px; height:18px; border-radius:50%; border:3px solid var(--border); background:#fff; z-index:2;}
  .tl-node.past .tl-dot{background:var(--teal); border-color:var(--teal);}
  .tl-node.current .tl-dot{background:var(--clay); border-color:var(--clay); box-shadow:0 0 0 5px var(--clay-soft);}
  .tl-line{position:absolute; top:8px; left:-50%; width:100%; height:3px; background:var(--border); z-index:1;}
  .tl-node:first-child .tl-line{display:none;}
  .tl-node.past .tl-line, .tl-node.current .tl-line{background:var(--teal);}
  .tl-label{margin-top:8px; font-size:12.5px; font-weight:700; text-align:center; color:var(--ink-muted);}
  .tl-node.current .tl-label{color:var(--clay);}
  .tl-node.past .tl-label{color:var(--teal-dark);}

  .filter-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;}
  .toggle-label{display:flex; align-items:center; gap:7px; font-size:14px; color:var(--ink-muted); font-weight:600;}
  .phase-section{margin-bottom:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); overflow:hidden;}
  .phase-section-head{display:flex; justify-content:space-between; align-items:center; padding:13px 16px; background:var(--surface-alt); cursor:pointer; user-select:none; width:100%; border:0; text-align:left;}
  .phase-section-head h3{margin:0; font-size:15.5px; color:var(--teal-dark); display:flex; gap:8px; align-items:center;}
  .phase-count{font-size:12.5px; color:var(--ink-muted); font-weight:600;}
  .chevron{transition:transform .15s;}
  .phase-section.collapsed .chevron{transform:rotate(-90deg);}
  .phase-section.collapsed .phase-body{display:none;}
  .phase-note{padding:14px 16px; font-size:13.5px; color:var(--ink-muted); background:var(--surface-alt);}

  .task-row{display:flex; align-items:flex-start; gap:12px; padding:11px 16px; border-top:1px solid var(--border);}
  .task-row:first-child{border-top:none;}
  .task-row.done{opacity:.62;}
  .task-check{width:26px; height:26px; border-radius:7px; border:2px solid #C5CEC2; background:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0;}
  .task-check.checked{background:var(--teal); border-color:var(--teal);}
  .task-check svg{display:none;}
  .task-check.checked svg{display:block;}
  .task-main{flex:1; min-width:0;}
  .task-title-btn{background:none; border:0; padding:0; text-align:left; font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.5;}
  .task-title-btn:hover .tt-text{text-decoration:underline; color:var(--teal-dark);}
  .info-mark{display:inline-flex; width:17px; height:17px; border-radius:50%; border:1.5px solid var(--ink-muted); color:var(--ink-muted); font-size:11px; font-weight:800; align-items:center; justify-content:center; margin-left:6px; vertical-align:1px;}
  .task-row.done .tt-text, tr.row-done .tt-text{text-decoration:line-through; color:var(--done);}
  .task-meta{display:flex; gap:10px; align-items:center; margin-top:4px; flex-wrap:wrap;}
  .due-badge{font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--surface-alt); color:var(--ink-muted);}
  .due-badge.overdue{background:var(--danger-soft); color:var(--danger);}
  .due-badge.soon{background:var(--clay-soft); color:var(--clay);}
  .moved{font-size:12px; color:var(--ink-muted);}

  .add-task-row{padding:10px 16px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .add-task-row input[type=text]{flex:2; min-width:160px; padding:8px 10px; border:1.5px solid var(--border); border-radius:7px; font-size:14px; background:var(--surface-alt);}
  .add-task-row input[type=date]{padding:7px 8px; border:1.5px solid var(--border); border-radius:7px; font-size:14px; background:var(--surface-alt);}

  .memo-box{margin-top:18px;}
  .memo-box label{font-size:13px; font-weight:700; color:var(--ink-muted); display:block; margin-bottom:6px;}
  .memo-box textarea{width:100%; min-height:80px; padding:10px; border:1.5px solid var(--border); border-radius:8px; background:#fff; font-size:14px; resize:vertical;}
  .footer-bar{display:flex; justify-content:space-between; align-items:center; margin-top:26px; padding-top:14px; border-top:1px solid var(--border);}
  .save-status{display:block; min-height:1em; font-size:12.5px; color:var(--ink-muted);}

  /* ---------- Task table ---------- */
  .table-toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .table-toolbar select{padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; background:#fff; color:var(--ink);}
  .tt-count{font-size:13px; color:var(--ink-muted); margin-left:auto;}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
  table.task-table{width:100%; border-collapse:collapse; font-size:14px; min-width:860px;}
  table.task-table th{text-align:left; padding:11px 12px; background:var(--surface-alt); color:var(--ink-muted); font-weight:700; font-size:13px; border-bottom:1.5px solid var(--border); white-space:nowrap;}
  table.task-table th button{background:none; border:0; padding:0; font:inherit; color:inherit;}
  table.task-table td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.task-table tr.row-done td{color:var(--done);}
  table.task-table tr.row-overdue td.tt-due{color:var(--danger); font-weight:700;}
  table.task-table tr.row-soon td.tt-due{color:var(--clay); font-weight:700;}
  .tt-resident-link{color:var(--teal-dark); font-weight:700; background:none; border:none; padding:0; font-size:14px; text-decoration:underline;}
  .table-empty{padding:36px 16px; text-align:center; color:var(--ink-muted);}

  /* ---------- Matrix ---------- */
  .matrix-wrap{overflow:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); max-height:72vh;}
  table.matrix-table{border-collapse:separate; border-spacing:0; font-size:12px;}
  table.matrix-table th, table.matrix-table td{border-bottom:1px solid var(--border); border-right:1px solid var(--border);}
  .mx-corner{position:sticky; left:0; top:0; z-index:5; background:var(--surface-alt); min-width:130px;}
  .mx-resident-head{position:sticky; left:0; top:30px; z-index:4; background:var(--surface-alt); min-width:130px; text-align:left; padding:8px 12px; font-weight:700; color:var(--ink-muted);}
  .mx-phase-head{position:sticky; top:0; z-index:3; text-align:center; padding:6px 4px; font-weight:700; font-size:12px; white-space:nowrap; height:30px;}
  .mx-task-head{position:sticky; top:30px; z-index:3; width:84px; min-width:84px; max-width:84px; padding:6px 3px; text-align:center; font-weight:600; font-size:11px; line-height:1.25; color:var(--ink-muted); white-space:normal; background:var(--surface-alt); vertical-align:bottom;}
  .mx-resident-cell{position:sticky; left:0; z-index:2; background:var(--surface); text-align:left; padding:7px 12px; white-space:nowrap;}
  .mx-resident-cell button{background:none; border:none; color:var(--teal-dark); font-weight:700; padding:0; font-size:13px; text-decoration:underline;}
  table.matrix-table tbody tr:nth-child(even) .mx-resident-cell, table.matrix-table tbody tr:nth-child(even) td.mx-cell{background:var(--surface-alt);}
  td.mx-cell{text-align:center; padding:4px; vertical-align:middle;}
  .mx-na{color:#C5CEC2; font-size:13px;}
  .mx-dot{min-width:70px; padding:4px 5px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; gap:3px; background:var(--surface-alt); border:1.5px solid var(--border); line-height:1.2; color:var(--ink-muted);}
  .mx-dot svg{width:11px; height:11px;}
  .mx-dot-check{width:14px; height:14px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center;}
  .mx-dot-date{font-size:11.5px; font-weight:700; white-space:nowrap;}
  .mx-dot.mx-done{background:#EDF5F0; border-color:var(--teal); color:var(--teal-dark);}
  .mx-dot.mx-overdue{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .mx-dot.mx-soon{background:var(--clay-soft); border-color:var(--clay); color:var(--clay);}
  .matrix-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--ink-muted); align-items:center;}
  .matrix-legend .lg-dot{width:13px; height:13px; border-radius:4px; display:inline-block; margin-right:5px; vertical-align:middle; border:1.5px solid var(--border);}

  /* ---------- Modal (popup) ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,28,24,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100; animation:fadeIn .15s ease-out;}
  .modal{background:#fff; border-radius:16px; width:100%; max-width:620px; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.25); animation:popIn .18s ease-out;}
  .modal.modal-sm{max-width:440px;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:18px 20px 12px; border-bottom:1px solid var(--border);}
  .modal-head h2{margin:0; font-size:18px; color:var(--teal-dark); line-height:1.4;}
  .modal-close{background:none; border:0; font-size:24px; line-height:1; color:var(--ink-muted); padding:2px 6px;}
  .modal-body{padding:16px 20px; overflow-y:auto; font-size:14.5px;}
  .modal-foot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; align-items:center; padding:12px 20px 16px; border-top:1px solid var(--border);}
  .modal-foot .spacer{margin-right:auto;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0; transform:translateY(8px) scale(.98)}to{opacity:1; transform:none}}

  .info-grid{display:grid; grid-template-columns:7.5em 1fr; gap:8px 12px; margin:0 0 14px;}
  .info-grid dt{font-size:13px; font-weight:700; color:var(--ink-muted);}
  .info-grid dd{margin:0;}
  .info-block{background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px;}
  .info-block h4{margin:0 0 4px; font-size:13px; color:var(--teal-dark);}
  .info-block p{margin:0; white-space:pre-line;}
  .info-block.basis{background:#FBF8F0; border-color:#EADFC4;}
  .info-block.basis h4{color:var(--gold);}
  .due-edit{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px;}
  .due-edit input{padding:6px 8px; border:1.5px solid var(--border); border-radius:7px; font-size:14px;}

  .notice-lead{margin:0 0 12px;}
  .notice-group{margin-bottom:14px;}
  .notice-group h3{font-size:14.5px; margin:0 0 6px; display:flex; align-items:center; gap:8px;}
  .notice-group.overdue h3{color:var(--danger);}
  .notice-group.soon h3{color:var(--clay);}
  .notice-item{display:grid; grid-template-columns:6.8em 10em 1fr; gap:8px; align-items:center; width:100%; text-align:left; background:#fff; border:1px solid var(--border); border-radius:9px; padding:8px 10px; margin-bottom:6px; font-size:14px; color:var(--ink);}
  .notice-item:hover{background:var(--surface-alt);}
  .notice-item .ni-date{font-weight:700; font-variant-numeric:tabular-nums;}
  .notice-group.overdue .ni-date{color:var(--danger);}
  .notice-group.soon .ni-date{color:var(--clay);}
  .notice-item .ni-name{font-weight:700; color:var(--teal-dark); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .notice-item .ni-name small{display:block; font-weight:600; color:var(--ink-muted); font-size:11.5px;}
  .notice-empty{padding:18px; text-align:center; color:var(--ink-muted); background:var(--surface-alt); border-radius:10px;}

  .setting-item{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border);}
  .setting-item:last-child{border-bottom:0;}
  .setting-item input{width:20px; height:20px; margin-top:2px; flex-shrink:0;}
  .setting-item small{display:block; color:var(--ink-muted); font-size:12.5px;}

  @media(max-width:600px){
    #app{padding:12px 12px 36px;}
    .topbar{padding:16px; gap:12px;}
    .brand-mark{display:none;}
    .topbar .btn{padding:9px 10px; font-size:13px;}
    .summary{gap:6px;}
    .metric{display:block; padding:10px 8px; font-size:12px;}
    .metric strong{display:block; margin-top:4px; font-size:24px;}
    .tabs{display:grid; grid-template-columns:repeat(3,1fr);}
    .tab-btn{font-size:12.5px; padding:10px 2px;}
    .field{min-width:100%;}
    .field input,.memo-box textarea{font-size:16px;}
    .resident-grid{grid-template-columns:1fr;}
    .modal-backdrop{align-items:flex-end; padding:0;}
    .modal{max-height:92vh; border-radius:16px 16px 0 0;}
    .info-grid{grid-template-columns:6em 1fr;}
    .notice-item{grid-template-columns:6.8em 1fr; }
    .notice-item .ni-title{grid-column:1 / -1;}
  }
</style>

  /* ================= 日付 ================= */
  function parseDate(s){ if(!s) return null; const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function fmtInput(d){ if(!d) return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  const WD = ['日','月','火','水','木','金','土'];
  function fmtJP(d){ if(!d) return '未設定'; return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; }
  function fmtMD(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function addMonths(d,n){ const r=new Date(d.getFullYear(),d.getMonth()+n+1,0); r.setDate(Math.min(d.getDate(),r.getDate())); return r; }
  function startOfDay(d){ const r=new Date(d); r.setHours(0,0,0,0); return r; }
  const TODAY = startOfDay(new Date());
  const TODAY_STR = fmtInput(TODAY);
  function diffDays(d){ return Math.round((startOfDay(d)-TODAY)/86400000); }

  const KIND_TAG = {
    kazan:'<span class="kind-tag kind-kazan">加算</span>',
    shihyo:'<span class="kind-tag kind-shihyo">指標</span>',
    custom:'<span class="kind-tag kind-custom">追加</span>',
    task:''

  /* ================= 保存 =================
     Googleスプレッドシート（Apps Script）で開いた場合：利用者1人ずつスプレッドシートに保存。
     ファイルを直接開いた場合：このブラウザーの中に保存（試用・体験用）。
     フロア・担当の絞り込みと「今日は表示しない」は、人ごとの設定なので各ブラウザーに保存。 */
  /* ▼ GitHub Pagesに置くとき：Apps Scriptのウェブアプリの URL を '' の中に貼り付ける */
  const API_URL = window.APP_API_URL || '';
  const IN_GAS = !!(window.google && google.script && google.script.run);   // Apps Scriptから直接開いた
  const VIA_URL = !IN_GAS && !!API_URL;                                       // GitHub Pagesなどから開いた
  const GAS = IN_GAS || VIA_URL;                                              // スプレッドシートにつながっている
  const LOCAL_KEY = window.APP_STORE_KEY || 'cm_app_data_v1';
  const PREF_KEY = (window.APP_STORE_KEY || 'cm_app') + '_prefs';
  let state = { residents: [], settings:{}, noticeHiddenDate:null, scope:{floor:'all', cm:'all'} };
  let saveStatusText = '';
  let pendingSaves = 0;
  let saveQueue = Promise.resolve();
  let lastLoadedAt = null;
  const memoTimers = {};

  function settings(){
    state.settings = state.settings || {};
    OPTIONAL_GROUPS.forEach(g=>{ if(state.settings[g.key] === undefined) state.settings[g.key] = true; });
    return state.settings;
  }
  let prefs = {};
  function gas(fn, ...args){
    if(IN_GAS) return new Promise((resolve, reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
    if(!prefs.accessKey){ const e = new Error('アクセスキーが未入力です'); e.code = 'need_key'; return Promise.reject(e); }
    // Content-Type を付けない（text/plain）ことで、ブラウザーの事前確認なしに送れる
    return fetch(API_URL, { method:'POST', body: JSON.stringify({ key: prefs.accessKey, user: prefs.userName || '', action: fn, args }) })
      .then(res => { if(!res.ok) throw new Error('通信エラー（' + res.status + '）'); return res.json(); })
      .then(json => {
        if(json && json.error){ const e = new Error(json.error === 'bad_key' ? 'アクセスキーが違います' : json.error); e.code = json.error; throw e; }
        return json.result;
      });
  }
  function readLocal(key){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch{ return null; } }
  function writeLocal(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }catch{ return false; } }
  function hhmm(d){ return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
  function setStatus(t){ saveStatusText = t; renderSaveStatusOnly(); }

  async function fetchData(){
    if(GAS) return await gas('api_load');
    const stored = readLocal(LOCAL_KEY) || {};
    let residents = Array.isArray(stored.residents) ? stored.residents : [];
    if(!residents.length && typeof window.APP_DEMO_SEED === 'function'){
      residents = window.APP_DEMO_SEED(TODAY, fmtInput, addDays);
      residents.forEach(r=>{
        if(!r._doneUntil) return;
        const until = parseDate(r._doneUntil), open = r._open || [];
        r.taskState = r.taskState || {};
        generateTasks(r).forEach(t=>{ if(t.baseDue < until && !open.includes(t.id)) r.taskState[t.id] = {done:true}; });
        delete r._doneUntil; delete r._open;
      });
      writeLocal(LOCAL_KEY, {residents, settings:stored.settings||{}});
    }
    return { residents, settings: stored.settings || {}, scope: stored.scope, noticeHiddenDate: stored.noticeHiddenDate };
  }

  async function loadState(){
    prefs = readLocal(PREF_KEY) || {};
    app.innerHTML = '<div class="empty-state"><strong>読み込み中…</strong></div>';
    let data;
    try{ data = await fetchData(); }
    catch(err){
      if(err && (err.code === 'need_key' || err.code === 'bad_key')){
        app.innerHTML = '<div class="empty-state"><strong>アクセスキーを入力してください</strong>係長から伝えられた名前とアクセスキーを入れると、スプレッドシートのデータが表示されます。<br><br><button class="btn btn-primary" data-action="key-dialog">入力する</button></div>';
        showKeyDialog(err.code === 'bad_key' ? 'アクセスキーが違います。もう一度確認してください。' : '');
        return;
      }
      app.innerHTML = `<div class="empty-state"><strong>データを読み込めませんでした</strong>${GAS ? 'スプレッドシートの共有（編集できる設定か）と、通信の状態を確認してください。' : 'ブラウザーの保存の設定を確認してください。'}<br><small>${escapeHtml(String(err && err.message || err))}</small></div>`;
      return;
    }
    state.residents = data.residents || [];
    state.settings = data.settings || {};
    state.scope = prefs.scope || data.scope || {floor:'all', cm:'all'};
    state.noticeHiddenDate = prefs.noticeHiddenDate || data.noticeHiddenDate || null;
    lastLoadedAt = new Date();
    settings();
    setStatus(GAS ? `スプレッドシートから読み込みました（${hhmm(lastLoadedAt)}）` : (window.APP_DEMO_SEED ? '体験版：架空のサンプルデータです。保存はこのブラウザーの中だけです。' : 'このブラウザーの中に保存しています（共有されません）。'));
    render();
    maybeShowStartupNotice();
  }

  /* 他のケアマネの更新を取り込む（入力中・保存中・ポップアップ表示中は待つ） */
  async function refresh(manual){
    if(!GAS) { if(manual) showMessage('最新にする', 'この画面はスプレッドシートにつながっていないため、取り込む先がありません。'); return; }
    const busy = pendingSaves > 0 || modalRoot.innerHTML || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if(busy && !manual) return;
    if(pendingSaves > 0){ showMessage('保存中です', '保存が終わってから、もう一度押してください。'); return; }
    try{
      if(manual) setStatus('最新の内容を読み込み中…');
      const data = await gas('api_load');
      state.residents = data.residents || [];
      state.settings = data.settings || {};
      settings();
      lastLoadedAt = new Date();
      if(view.residentId && !getResident(view.residentId)){ view.mode='list'; view.residentId=null; }
      saveStatusText = `最新の内容です（${hhmm(lastLoadedAt)}）`;
      render();
    }catch(err){ setStatus('最新の内容を読み込めませんでした。通信を確認してください。'); }
  }
  if(GAS){
    setInterval(()=>{ if(document.visibilityState === 'visible') refresh(false); }, 120000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && lastLoadedAt && Date.now()-lastLoadedAt > 60000) refresh(false); });
  }

  function enqueue(job){
    pendingSaves++;
    setStatus('保存中…');
    saveQueue = saveQueue.then(job).then(()=>{
      pendingSaves--;
      if(!pendingSaves) setStatus(`保存しました（${hhmm(new Date())}）`);
    }).catch(err=>{
      pendingSaves--;
      if(err && err.code === 'bad_key'){ setStatus('アクセスキーが違うため保存できませんでした。'); showKeyDialog('アクセスキーが変わった可能性があります。入れ直してから、もう一度操作してください。'); return; }
      setStatus('保存できませんでした。通信を確認し、「最新にする」を押してからやり直してください。');
      showMessage('保存できませんでした', '通信が切れたか、スプレッドシートを編集する権限がない可能性があります。「最新にする」を押して内容を確認してから、もう一度操作してください。');
    });
  }
  function persistLocal(){
    if(!writeLocal(LOCAL_KEY, {residents: state.residents, settings: state.settings})) throw new Error('local save failed');
  }
  function savePrefs(){ prefs.scope = state.scope; prefs.noticeHiddenDate = state.noticeHiddenDate; writeLocal(PREF_KEY, prefs); }

  /* 名前・アクセスキーの入力（GitHub Pages版のみ） */
  function showKeyDialog(errorText){
    openModal({ title:'接続の設定', size:'modal-sm',
      body:`<p style="margin:0 0 10px">スプレッドシートのデータを見るための設定です。この端末のブラウザーに保存され、次からは入力不要です。</p>
        <div class="field" style="margin-bottom:10px"><label for="k-name">あなたの名前（更新者として記録されます）</label><input type="text" id="k-name" value="${escapeHtml(prefs.userName||'')}" placeholder="例）中村" data-autofocus></div>
        <div class="field"><label for="k-key">アクセスキー</label><input type="password" id="k-key" value="${escapeHtml(prefs.accessKey||'')}" autocomplete="off"></div>
        <div class="form-error" id="k-error">${escapeHtml(errorText||'')}</div>`,
      foot:`<button class="btn btn-ghost" data-m="close">やめる</button><button class="btn btn-primary" data-m="ok">つなぐ</button>` },
      { ok:()=>{
          const name = document.getElementById('k-name').value.trim();
          const key = document.getElementById('k-key').value.trim();
          if(!name || !key){ document.getElementById('k-error').textContent = '名前とアクセスキーを入力してください。'; return; }
          prefs.userName = name; prefs.accessKey = key; writeLocal(PREF_KEY, prefs);
          closeModal(); loadState();
        } });
  }

  function saveResident(r){
    const id = r.id;
    enqueue(async ()=>{
      if(!GAS){ persistLocal(); return; }
      const cur = getResident(id);
      if(!cur) return;
      const res = await gas('api_saveResident', JSON.parse(JSON.stringify(cur)), prefs.userName || '');
      if(res.ok){
        const now = getResident(id);
        if(now){ now.rev = res.rev; now.updatedAt = res.updatedAt; now.updatedBy = res.updatedBy; }
      }else if(res.conflict){
        if(res.resident){ state.residents = state.residents.map(x=>x.id===id ? res.resident : x); }
        else{ state.residents = state.residents.filter(x=>x.id!==id); if(view.residentId===id){ view.mode='list'; view.residentId=null; } }
        render();
        showMessage('ほかの人が先に更新していました', res.resident
          ? `${res.resident.name}さんの内容は、少し前にほかの人が更新していました。最新の内容に入れ替えたので、確認してからもう一度操作してください。`
          : 'この利用者は、ほかの人が削除していました。');
      }
    });
  }
  function saveResidentLater(r){
    clearTimeout(memoTimers[r.id]);
    setStatus('入力中…');
    memoTimers[r.id] = setTimeout(()=>saveResident(r), 1200);
  }
  function deleteResidentData(id){
    enqueue(async ()=>{ if(!GAS){ persistLocal(); return; } await gas('api_deleteResident', id); });
  }
  function saveSettings(){
    enqueue(async ()=>{ if(!GAS){ persistLocal(); return; } await gas('api_saveSettings', state.settings); });
  }
  function renderSaveStatusOnly(){ const el = document.querySelector('.save-status'); if(el) el.textContent = saveStatusText; }

  /* ================= タスク生成 ================= */
  function timingText(anchor, offset){
    const base = anchor === 'admission' ? '入所日' : '退所予定日';
    if(offset === 0) return `${base}当日`;
    return offset < 0 ? `${base}の${-offset}日前` : `${base}の${offset}日後`;
  }

  function generateTasks(resident){
    const admission = parseDate(resident.admissionDate);
    const discharge = parseDate(resident.dischargeDate);
    const tasks = [];
    TEMPLATES.forEach(t=>{
      const anchor = t.anchor === 'admission' ? admission : discharge;
      if(!anchor) return;
      tasks.push({ id:t.id, phase:t.phase, kind:t.kind, title:t.title, desc:t.desc, basis:t.basis,
        baseDue:addDays(anchor, t.offset), timing:timingText(t.anchor, t.offset), custom:false });
    });
    if(admission){
      // 退所予定日が未定の人は、入所後6か月か今日から3か月先の遅い方まで表示（先の分は日がたつと自動で出てくる）
      const horizon = discharge || new Date(Math.max(addMonths(admission, 6), addMonths(TODAY, 3)));
      const st = settings();
      STAY_DEFS.forEach(def=>{
        if(def.group && !st[def.group]) return;
        for(let n=1; n<=36; n++){
          const months = n*def.every;
          const d = addMonths(admission, months);
          if(d >= horizon) break;
          tasks.push({ id:def.prefix+n, phase:'stay', kind:def.kind, title:def.title(n, months), desc:def.desc, basis:def.basis,
            baseDue:d, timing: def.every===1 ? '入所日から毎月（同じ日付）' : `入所日から${def.every}か月ごと`, custom:false, stayKey:def.key });
        }
      });
    }
    return tasks;
  }

  function buildFullTaskList(resident){
    const stateMap = resident.taskState || {};
    const list = generateTasks(resident).map(t=>{
      const st = stateMap[t.id] || {};
      const override = st.due ? parseDate(st.due) : null;
      return { ...t, due: override || t.baseDue, moved: !!override, done: !!st.done };
    });
    (resident.customTasks||[]).forEach(ct=>{
      list.push({ id:ct.id, phase:ct.phase, kind:'custom', title:ct.title, due:parseDate(ct.due), baseDue:parseDate(ct.due),
        done:!!ct.done, custom:true, desc:'', basis:'', timing:'手入力の期限' });
    });
    return list;
  }

  function findTask(resident, id){ return buildFullTaskList(resident).find(t=>t.id===id); }

  function currentPhase(resident){
    const admission = parseDate(resident.admissionDate);
    const discharge = parseDate(resident.dischargeDate);
    if(!admission || TODAY < admission) return 'pre';
    if(TODAY.getTime() === admission.getTime()) return 'adm';
    if(discharge){
      if(TODAY >= discharge) return 'postdis';
      if(TODAY >= addDays(discharge,-30)) return 'predis';
    }
    return 'stay';
  }

  function statusCategory(t){
    if(t.done) return 'done';
    const diff = diffDays(t.due);
    if(diff < 0) return 'overdue';
    if(diff <= 7) return 'soon';
    return 'upcoming';
  }

  function toggleDone(resident, id, isCustom){
    if(isCustom){
      const ct = (resident.customTasks||[]).find(c=>c.id===id);
      if(ct) ct.done = !ct.done;
    }else{
      resident.taskState = resident.taskState || {};
      const st = resident.taskState[id] || {};
      resident.taskState[id] = { ...st, done: !st.done };
    }
    saveResident(resident);
  }

  function collectAlerts(){
    const overdue = [], soon = [];
    visibleResidents().forEach(r=>{
      buildFullTaskList(r).forEach(t=>{
        const c = statusCategory(t);
        const row = {...t, residentId:r.id, residentName:r.name, floor:floorText(r), cm:cmText(r)};
        if(c==='overdue') overdue.push(row);
        if(c==='soon') soon.push(row);
      });
    });
    overdue.sort((a,b)=>a.due-b.due); soon.sort((a,b)=>a.due-b.due);
    return {overdue, soon};
  }

  /* ================= 画面の状態 ================= */
  let view = {
    mode:'list', tab:'cards', residentId:null, showFormPanel:false, hideDone:false, collapsedPhases:{},
    taskSort:{key:'due', dir:'asc'},
    taskFilters:{residentId:'all', phase:'all', status:'all', kind:'all'}
  };
  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
  function getResident(id){ return state.residents.find(r=>r.id===id); }

  /* ---------- フロア・担当ケアマネ ---------- */
  const NONE = '__none__';
  const FLOORS = ['本館4階','本館3階','本館2階','新館3階','新館2階'];
  function floorOptions(){ return [...FLOORS, ...uniqueValues('floor').filter(v=>!FLOORS.includes(v))]; }
  function floorRank(v){ const i = FLOORS.indexOf(v); return i<0 ? FLOORS.length : i; }
  function floorSelect(attrs, cur){
    cur = (cur||'').trim();
    return `<select ${attrs}><option value="" ${cur?'':'selected'}>未設定</option>${floorOptions().map(f=>`<option value="${escapeHtml(f)}" ${f===cur?'selected':''}>${escapeHtml(f)}</option>`).join('')}</select>`;
  }
  const jaSort = (a,b)=>a.localeCompare(b,'ja',{numeric:true});
  function scope(){ state.scope = state.scope || {floor:'all', cm:'all'}; return state.scope; }
  function uniqueValues(field){ return [...new Set(state.residents.map(r=>(r[field]||'').trim()).filter(Boolean))].sort(jaSort); }
  function floorText(r){ return (r.floor||'').trim() || 'フロア未設定'; }
  function cmText(r){ return (r.cm||'').trim() || '担当未設定'; }
  function matchScope(r){
    const sc = scope();
    const fl = (r.floor||'').trim(), cm = (r.cm||'').trim();
    if(sc.floor !== 'all' && (sc.floor === NONE ? fl !== '' : fl !== sc.floor)) return false;
    if(sc.cm !== 'all' && (sc.cm === NONE ? cm !== '' : cm !== sc.cm)) return false;
    return true;
  }
  function visibleResidents(){
    return state.residents.filter(matchScope).slice().sort((a,b)=>{
      const fa=(a.floor||'').trim(), fb=(b.floor||'').trim();
      if(!fa !== !fb) return fa ? -1 : 1;
      return (floorRank(fa)-floorRank(fb)) || jaSort(fa,fb);
    });
  }
  function scopeLabel(){
    const sc = scope(); const parts=[];
    if(sc.floor!=='all') parts.push(sc.floor===NONE?'フロア未設定':sc.floor);
    if(sc.cm!=='all') parts.push(sc.cm===NONE?'担当未設定':`担当：${sc.cm}`);
    return parts.join('・');
  }
  function staffChips(r){
    return `<div class="rc-staff"><span class="staff-chip ${r.floor?'':'none'}">${escapeHtml(floorText(r))}</span><span class="staff-chip cm ${r.cm?'':'none'}">${r.cm?'担当 '+escapeHtml(r.cm):'担当未設定'}</span></div>`;
  }
  function datalists(){
    return `<datalist id="dl-floor">${uniqueValues('floor').map(v=>`<option value="${escapeHtml(v)}">`).join('')}</datalist>
      <datalist id="dl-cm">${uniqueValues('cm').map(v=>`<option value="${escapeHtml(v)}">`).join('')}</datalist>`;
  }
  function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ================= 描画 ================= */
  const app = document.getElementById('app');

  function render(){
    if(view.mode === 'detail' && view.residentId && getResident(view.residentId)){
      app.innerHTML = renderHeader() + renderDetail(getResident(view.residentId));
    }else{
      view.mode = 'list';
      const body = view.tab === 'tasks' ? renderTaskTable() : view.tab === 'matrix' ? renderMatrix() : renderListBody();
      app.innerHTML = renderHeader() + renderForm() + renderScopeBar() + renderSummary() + renderTabs() + body
        + `<div class="footer-bar"><span class="save-status" role="status"></span>${VIA_URL ? `<button class="btn-text" data-action="key-dialog">接続の設定（${escapeHtml(prefs.userName||'名前未設定')}）</button>` : ''}</div>`;
    }
    renderSaveStatusOnly();
  }

  function renderHeader(){
    const {overdue, soon} = collectAlerts();
    const n = overdue.length + soon.length;
    return `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div>
            <div class="brand-title">ケアマネ業務ナビ</div>
            <div class="brand-sub">介護老人保健施設おおやけの里　入所前〜退所後のタスク管理${window.APP_DEMO_SEED ? '　<b style="background:#E9B9A9;color:#5A2416;padding:1px 8px;border-radius:6px">体験版（架空のデータ）</b>' : ''}</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn btn-sub" data-action="show-notice">期限のお知らせ${n?`<span class="notice-count">${n}</span>`:''}</button>
          ${GAS ? '<button class="btn btn-sub" data-action="refresh">最新にする</button>' : ''}
          <button class="btn btn-sub" data-action="settings">加算の表示設定</button>
          ${view.mode==='list'
            ? `<button class="btn" data-action="toggle-form">＋ 利用者を追加</button>`
            : `<button class="btn" data-action="back">← 利用者一覧へ</button>`}
        </div>
      </div>`;
  }

  function renderSummary(){
    const {overdue, soon} = collectAlerts();
    return '<div class="summary">' + [
      ['cards', scopeLabel()?'表示中の利用者':'登録利用者', visibleResidents().length,'人'],
      ['overdue','期限超過',overdue.length,'件'],
      ['soon','今日〜7日後',soon.length,'件']
    ].map(([status,label,count,unit]) => `<button class="metric" data-status="${status}" aria-label="${label} ${count}${unit}を表示"><span>${label}</span><strong>${count}<small>${unit}</small></strong></button>`).join('') + '</div>';
  }

  function renderScopeBar(){
    if(!state.residents.length) return '';
    const sc = scope();
    const opt = (v,label,cur)=>`<option value="${escapeHtml(v)}" ${v===cur?'selected':''}>${escapeHtml(label)}</option>`;
    const floors = floorOptions().filter(f=>state.residents.some(r=>(r.floor||'').trim()===f)), cms = uniqueValues('cm');
    const hasNoFloor = state.residents.some(r=>!(r.floor||'').trim()), hasNoCm = state.residents.some(r=>!(r.cm||'').trim());
    return `<div class="scope-bar ${scopeLabel()?'scope-on':''}">
      <label>フロア<select data-scope="floor">${opt('all','すべて',sc.floor)}${floors.map(f=>opt(f,f,sc.floor)).join('')}${hasNoFloor?opt(NONE,'未設定',sc.floor):''}</select></label>
      <label>担当ケアマネ<select data-scope="cm">${opt('all','すべて',sc.cm)}${cms.map(c=>opt(c,c,sc.cm)).join('')}${hasNoCm?opt(NONE,'未設定',sc.cm):''}</select></label>
      ${scopeLabel()?`<button class="btn-text" data-action="clear-scope">絞り込みを解除</button>`:''}
      <span class="scope-note">ここでの絞り込みは、カード・一覧・表・期限のお知らせのすべてに効き、次に開いたときも残ります。</span>
    </div>`;
  }

  function renderTabs(){
    return `<div class="tabs" role="tablist">
      <button class="tab-btn ${view.tab==='cards'?'active':''}" data-action="tab" data-tab="cards">利用者カード</button>
      <button class="tab-btn ${view.tab==='tasks'?'active':''}" data-action="tab" data-tab="tasks">タスク一覧</button>
      <button class="tab-btn ${view.tab==='matrix'?'active':''}" data-action="tab" data-tab="matrix">利用者×タスク表</button>
    </div>`;
  }

  function renderForm(){
    if(!view.showFormPanel) return '';
    return `
      <div class="panel"><h2 class="section-title">利用者の登録</h2>
        <div class="field-row">
          <div class="field"><label for="f-name">氏名（必須）</label><input type="text" id="f-name" placeholder="例）山田 太郎"></div>
          <div class="field"><label for="f-admission">入所日（必須）</label><input type="date" id="f-admission"></div>
          <div class="field"><label for="f-discharge">退所予定日（後から入力できます）</label><input type="date" id="f-discharge"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-floor">フロア</label>${floorSelect('id="f-floor"', scope().floor!=='all'&&scope().floor!==NONE?scope().floor:'')}</div>
          <div class="field"><label for="f-cm">担当ケアマネ</label><input type="text" id="f-cm" list="dl-cm" placeholder="例）亀橋" value="${escapeHtml(scope().cm!=='all'&&scope().cm!==NONE?scope().cm:'')}"></div>
        </div>${datalists()}
        <div class="hint">担当ケアマネは、一度入れた名前が次から候補に出ます。入所日を入れると、入所前・入所時・入所中のタスクが自動で並びます。退所予定日を入れると、退所前・退所後のタスクも加わります。</div>
        <div class="form-error" id="form-error" role="alert"></div>
        <div class="form-actions">
          <button class="btn btn-ghost" data-action="cancel-form">キャンセル</button>
          <button class="btn btn-primary" data-action="save-new">登録する</button>
        </div>
      </div>`;
  }

  function renderListBody(){
    const residents = visibleResidents();
    if(state.residents.length && !residents.length){
      return `<div class="empty-state"><strong>条件に合う利用者がいません</strong>フロア・担当ケアマネの絞り込みを確認してください。</div>`;
    }
    if(residents.length === 0){
      return `<div class="empty-state"><strong>まだ利用者が登録されていません</strong>「＋ 利用者を追加」から入所日を入力すると、入所前から退所後までのタスクが自動で並びます。</div>`;
    }
    const groups = [];
    residents.forEach(r=>{ const k=floorText(r); let g=groups.find(x=>x.k===k); if(!g){ g={k,list:[]}; groups.push(g);} g.list.push(r); });
    return groups.map(g=>{
      const cmsInFloor = [...new Set(g.list.map(r=>(r.cm||'').trim()).filter(Boolean))].sort(jaSort);
      return `<div class="floor-head"><h3>${escapeHtml(g.k)}</h3><span>${g.list.length}人${cmsInFloor.length?'　担当：'+cmsInFloor.map(escapeHtml).join('、'):''}</span></div>`
        + renderCards(g.list);
    }).join('');
  }

  function renderCards(residents){
    return '<div class="resident-grid">' + residents.map(r=>{
      const tasks = buildFullTaskList(r);
      const total = tasks.length, doneCount = tasks.filter(t=>t.done).length;
      const pct = total ? Math.round(doneCount/total*100) : 0;
      const phase = currentPhase(r);
      const overdueN = tasks.filter(t=>statusCategory(t)==='overdue').length;
      const upcoming = tasks.filter(t=>!t.done).sort((a,b)=>a.due-b.due)[0];
      return `
        <button class="resident-card" data-action="open" data-id="${r.id}">
          <div class="rc-top">
            <div class="rc-name">${escapeHtml(r.name)}</div>
            <span class="phase-badge phase-${phase}">${phaseLabel(phase)}</span>
          </div>
          ${staffChips(r)}
          <div class="rc-dates">入所日 ${r.admissionDate ? fmtJP(parseDate(r.admissionDate)) : '未設定'}<br>退所予定 ${r.dischargeDate ? fmtJP(parseDate(r.dischargeDate)) : '未設定'}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="rc-foot">${doneCount}/${total} 完了（${pct}%）</div>
          ${overdueN ? `<div class="rc-alert">期限超過 ${overdueN}件</div>` : ''}
          ${upcoming ? `<div class="rc-next">次のタスク：${escapeHtml(upcoming.title)}　<b>${fmtJP(upcoming.due)}</b></div>` : '<div class="rc-next">未完了のタスクはありません</div>'}
        </button>`;
    }).join('') + '</div>';
  }

  function checkButton(t, residentId){
    return `<button aria-label="${escapeHtml(t.title)}を${t.done?'未完了に戻す':'完了にする'}" aria-pressed="${t.done}" class="task-check ${t.done?'checked':''}" data-action="toggle" data-resident="${residentId}" data-id="${t.id}" data-custom="${t.custom}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>`;
  }
  function titleButton(t, residentId){
    return `<button class="task-title-btn" data-action="info" data-resident="${residentId}" data-id="${t.id}">${KIND_TAG[t.kind]||''}<span class="tt-text">${escapeHtml(t.title)}</span><span class="info-mark" aria-hidden="true">i</span></button>`;
  }

  function renderTaskTable(){
    const residents = visibleResidents();
    if(state.residents.length && !residents.length){
      return `<div class="empty-state"><strong>条件に合う利用者がいません</strong>フロア・担当ケアマネの絞り込みを確認してください。</div>`;
    }
    if(residents.length === 0){
      return `<div class="empty-state"><strong>まだ利用者が登録されていません</strong>利用者を登録すると、ここに全員分のタスクが期限順に並びます。</div>`;
    }
    let rows = [];
    residents.forEach(r=>buildFullTaskList(r).forEach(t=>rows.push({ ...t, residentId:r.id, residentName:r.name, floor:floorText(r), cm:cmText(r) })));
    const f = view.taskFilters;
    if(f.residentId !== 'all') rows = rows.filter(t=>t.residentId === f.residentId);
    if(f.phase !== 'all') rows = rows.filter(t=>t.phase === f.phase);
    if(f.kind !== 'all') rows = rows.filter(t=>t.kind === f.kind);
    if(f.status !== 'all') rows = rows.filter(t=> f.status==='undone' ? !t.done : statusCategory(t) === f.status);

    const sortKey = view.taskSort.key, dir = view.taskSort.dir === 'asc' ? 1 : -1;
    rows.sort((a,b)=>{
      let av, bv;
      if(sortKey==='due'){ av=a.due.getTime(); bv=b.due.getTime(); }
      else if(sortKey==='resident'){ av=a.residentName; bv=b.residentName; }
      else if(sortKey==='floor'){ av=a.floor+a.residentName; bv=b.floor+b.residentName; return dir*jaSort(av,bv); }
      else if(sortKey==='cm'){ av=a.cm+a.residentName; bv=b.cm+b.residentName; return dir*jaSort(av,bv); }
      else if(sortKey==='phase'){ av=PHASES.findIndex(p=>p.key===a.phase); bv=PHASES.findIndex(p=>p.key===b.phase); }
      else { av=a.title; bv=b.title; }
      return av < bv ? -dir : av > bv ? dir : 0;
    });

    const sel = (v,cur)=> v===cur ? 'selected' : '';
    const residentOptions = residents.map(r=>`<option value="${r.id}" ${sel(r.id,f.residentId)}>${escapeHtml(r.name)}</option>`).join('');
    const phaseOptions = PHASES.map(p=>`<option value="${p.key}" ${sel(p.key,f.phase)}>${p.label}</option>`).join('');
    const arrow = key => sortKey===key ? `<span aria-hidden="true">${dir===1?' ▲':' ▼'}</span>` : '';

    const bodyHtml = rows.length === 0
      ? `<tr><td colspan="7" class="table-empty">条件に合うタスクはありません。</td></tr>`
      : rows.map(t=>{
          const cat = statusCategory(t);
          const rowCls = t.done ? 'row-done' : cat==='overdue' ? 'row-overdue' : cat==='soon' ? 'row-soon' : '';
          return `<tr class="${rowCls}">
            <td>${checkButton(t, t.residentId)}</td>
            <td class="tt-due">${fmtJP(t.due)}</td>
            <td><button class="tt-resident-link" data-action="open" data-id="${t.residentId}">${escapeHtml(t.residentName)}</button></td>
            <td>${escapeHtml(t.floor)}</td>
            <td>${escapeHtml(t.cm)}</td>
            <td><span class="tt-phase-tag phase-${t.phase}">${phaseLabel(t.phase)}</span></td>
            <td>${titleButton(t, t.residentId)}</td>
          </tr>`;
        }).join('');

    return `
      <div class="table-toolbar">
        <select data-tablefilter="residentId" aria-label="利用者で絞り込む"><option value="all">利用者：すべて</option>${residentOptions}</select>
        <select data-tablefilter="phase" aria-label="時期で絞り込む"><option value="all">時期：すべて</option>${phaseOptions}</select>
        <select data-tablefilter="kind" aria-label="種類で絞り込む">
          <option value="all" ${sel('all',f.kind)}>種類：すべて</option>
          <option value="kazan" ${sel('kazan',f.kind)}>加算のみ</option>
          <option value="shihyo" ${sel('shihyo',f.kind)}>在宅復帰指標のみ</option>
          <option value="task" ${sel('task',f.kind)}>通常業務のみ</option>
          <option value="custom" ${sel('custom',f.kind)}>追加したタスクのみ</option>
        </select>
        <select data-tablefilter="status" aria-label="状態で絞り込む">
          <option value="all" ${sel('all',f.status)}>状態：すべて</option>
          <option value="undone" ${sel('undone',f.status)}>未完了のみ</option>
          <option value="done" ${sel('done',f.status)}>完了のみ</option>
          <option value="overdue" ${sel('overdue',f.status)}>期限超過のみ</option>
          <option value="soon" ${sel('soon',f.status)}>7日以内のみ</option>
        </select>
        <span class="tt-count">${rows.length} 件</span>
      </div>
      <div class="table-wrap">
        <table class="task-table">
          <thead><tr>
            <th style="width:48px">完了</th>
            <th><button data-action="sort-table" data-key="due">期限${arrow('due')}</button></th>
            <th><button data-action="sort-table" data-key="resident">利用者${arrow('resident')}</button></th>
            <th><button data-action="sort-table" data-key="floor">フロア${arrow('floor')}</button></th>
            <th><button data-action="sort-table" data-key="cm">担当${arrow('cm')}</button></th>
            <th><button data-action="sort-table" data-key="phase">時期${arrow('phase')}</button></th>
            <th><button data-action="sort-table" data-key="title">タスク（名前を押すと説明）${arrow('title')}</button></th>
          </tr></thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      </div>`;
  }

  /* ---------- 利用者×タスク表 ---------- */
  function getMatrixColumns(){
    const cols = [];
    const fixed = phase => TEMPLATES.filter(t=>t.phase===phase).forEach(t=>cols.push({type:'fixed', id:t.id, phase, label:t.short, title:t.title}));
    TEMPLATES.filter(t=>t.phase==='pre' && ['pre_handover','pre_meeting','pre_temp_plan','pre_assess_prep'].includes(t.id))
      .forEach(t=>cols.push({type:'fixed', id:t.id, phase:'pre', label:t.short, title:t.title}));
    fixed('adm');
    const st = settings();
    STAY_DEFS.forEach(d=>{ if(d.group && !st[d.group]) return; cols.push({type:'stay', key:d.key, prefix:d.prefix, phase:'stay', label:d.short, title:d.title(1, d.every).replace(/（.*?）$/,'')+'（直近）'}); });
    fixed('predis'); fixed('postdis');
    return cols;
  }

  function getMatrixCell(col, residentTasks){
    if(col.type==='fixed'){
      const t = residentTasks.find(x=>x.id===col.id);
      return t ? t : null;
    }
    const tasks = residentTasks.filter(t=>t.id.startsWith(col.prefix)).sort((a,b)=>a.due-b.due);
    if(!tasks.length) return null;
    return tasks.find(t=>!t.done) || tasks[tasks.length-1];
  }

  function renderMatrix(){
    const residents = visibleResidents();
    if(state.residents.length && !residents.length){
      return `<div class="empty-state"><strong>条件に合う利用者がいません</strong>フロア・担当ケアマネの絞り込みを確認してください。</div>`;
    }
    if(residents.length===0){
      return `<div class="empty-state"><strong>まだ利用者が登録されていません</strong>利用者を登録すると、ここに利用者×タスクの一覧表が出ます。</div>`;
    }
    const cols = getMatrixColumns();
    let lastPhase = null;
    const phaseHeadHtml = cols.map(c=>{
      if(c.phase===lastPhase) return '';
      lastPhase = c.phase;
      return `<th class="mx-phase-head phase-${c.phase}" colspan="${cols.filter(cc=>cc.phase===c.phase).length}">${phaseLabel(c.phase)}</th>`;
    }).join('');
    const taskHeadHtml = cols.map(c=>`<th class="mx-task-head" title="${escapeHtml(c.title)}">${escapeHtml(c.label)}</th>`).join('');

    const bodyHtml = residents.map(r=>{
      const residentTasks = buildFullTaskList(r);
      const cells = cols.map(c=>{
        const t = getMatrixCell(c, residentTasks);
        if(!t) return `<td class="mx-cell"><span class="mx-na">—</span></td>`;
        const cat = statusCategory(t);
        const cls = cat==='done' ? 'mx-done' : cat==='overdue' ? 'mx-overdue' : cat==='soon' ? 'mx-soon' : '';
        const icon = t.done ? `<span class="mx-dot-check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : '';
        return `<td class="mx-cell"><button class="mx-dot ${cls}" aria-label="${escapeHtml(r.name)}：${escapeHtml(t.title)}（${fmtJP(t.due)}）の詳細" data-action="info" data-resident="${r.id}" data-id="${t.id}">${icon}<span class="mx-dot-date">${fmtMD(t.due)}</span></button></td>`;
      }).join('');
      return `<tr><td class="mx-resident-cell"><button data-action="open" data-id="${r.id}">${escapeHtml(r.name)}</button><span class="mx-sub">${escapeHtml(floorText(r))}／${escapeHtml(cmText(r))}</span></td>${cells}</tr>`;
    }).join('');

    return `
      <div class="matrix-wrap">
        <table class="matrix-table">
          <thead>
            <tr><th class="mx-corner"></th>${phaseHeadHtml}</tr>
            <tr><th class="mx-resident-head">利用者（フロア／担当）</th>${taskHeadHtml}</tr>
          </thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      </div>
      <div class="matrix-legend">
        <span><span class="lg-dot" style="background:var(--teal); border-color:var(--teal);"></span>完了</span>
        <span><span class="lg-dot" style="background:var(--danger-soft); border-color:var(--danger);"></span>期限超過</span>
        <span><span class="lg-dot" style="background:var(--clay-soft); border-color:var(--clay);"></span>7日以内</span>
        <span><span class="lg-dot" style="background:var(--surface-alt);"></span>まだ先</span>
        <span><span class="mx-na" style="font-weight:700;">—</span>　対象外（日付未設定）</span>
        <span>★＝加算　◆＝在宅復帰指標。セルを押すと説明が開き、そこで完了にできます。</span>
      </div>`;
  }

  function dueBadge(t){
    const cat = statusCategory(t);
    if(cat==='overdue') return `<span class="due-badge overdue">期限超過：${fmtJP(t.due)}</span>`;
    if(cat==='soon') return `<span class="due-badge soon">7日以内：${fmtJP(t.due)}</span>`;
    return `<span class="due-badge">${fmtJP(t.due)}</span>`;
  }

  function renderDetail(r){
    const tasks = buildFullTaskList(r);
    const total = tasks.length, doneCount = tasks.filter(t=>t.done).length;
    const phaseNow = currentPhase(r);
    const admission = parseDate(r.admissionDate);
    const discharge = parseDate(r.dischargeDate);

    let pastReached = true;
    const timelineHtml = PHASES.map(p=>{
      let cls = '';
      if(p.key === phaseNow){ cls='current'; pastReached=false; }
      else if(pastReached){ cls='past'; }
      return `<div class="tl-node ${cls}"><div class="tl-line"></div><div class="tl-dot"></div><div class="tl-label">${p.label}</div></div>`;
    }).join('');

    const sectionsHtml = PHASES.map(p=>{
      let pTasks = tasks.filter(t=>t.phase===p.key);
      const doneInPhase = pTasks.filter(t=>t.done).length, totalInPhase = pTasks.length;
      if(view.hideDone) pTasks = pTasks.filter(t=>!t.done);
      pTasks.sort((a,b)=>a.due-b.due);
      const collapsed = view.collapsedPhases[p.key] ? 'collapsed' : '';
      let body;
      if((p.key==='predis'||p.key==='postdis') && !discharge && !pTasks.length){
        body = `<div class="phase-note">退所予定日を入れると、${p.label}のタスクが自動で表示されます。</div>`;
      }else{
        body = pTasks.map(t=>`
          <div class="task-row ${t.done?'done':''}">
            ${checkButton(t, r.id)}
            <div class="task-main">
              ${titleButton(t, r.id)}
              <div class="task-meta">${dueBadge(t)}${t.moved?'<span class="moved">（期限を変更済み）</span>':''}</div>
            </div>
          </div>`).join('') || `<div class="phase-note">該当するタスクはありません。</div>`;
      }
      const defaultDate = fmtInput(['pre','adm','stay'].includes(p.key) ? admission : discharge) || TODAY_STR;
      return `
        <div class="phase-section ${collapsed}">
          <button class="phase-section-head" data-action="toggle-phase" data-phase="${p.key}" aria-expanded="${!collapsed}">
            <h3><svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#6E756B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>${p.label}</h3>
            <span class="phase-count">${doneInPhase}/${totalInPhase} 完了</span>
          </button>
          <div class="phase-body">
            ${body}
            <div class="add-task-row">
              <input type="text" placeholder="タスクを追加（例：ご家族へ書類の返送依頼）" aria-label="${p.label}に追加するタスク名" data-newtask-title="${p.key}">
              <input type="date" aria-label="期限" data-newtask-date="${p.key}" value="${defaultDate}">
              <button class="btn btn-ghost" data-action="add-task" data-phase="${p.key}">追加</button>
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="detail-header">
        <div class="detail-name-row">
          <div class="detail-name">${escapeHtml(r.name)}</div>
          <span class="phase-badge phase-${phaseNow}">${phaseLabel(phaseNow)}</span>
          <button class="btn-text" data-action="rename">名前を編集</button>
          <button class="btn-danger-text" data-action="delete-resident">この利用者を削除</button>
        </div>
        <div class="meta-grid">
          <div class="meta-item"><span>入所日</span><input type="date" value="${r.admissionDate||''}" data-field="admissionDate"></div>
          <div class="meta-item"><span>退所予定日</span><input type="date" value="${r.dischargeDate||''}" data-field="dischargeDate"></div>
          <div class="meta-item"><span>フロア</span>${floorSelect('data-textfield="floor" aria-label="フロア"', r.floor)}</div>
          <div class="meta-item"><span>担当ケアマネ</span><input type="text" list="dl-cm" value="${escapeHtml(r.cm||'')}" data-textfield="cm" placeholder="例）亀橋"></div>
          <div class="meta-item"><span>進み具合</span>${doneCount}/${total} 完了</div>
          ${r.updatedAt ? `<div class="meta-item"><span>最終更新</span><small>${escapeHtml(r.updatedAt)}${r.updatedBy?'<br>'+escapeHtml(r.updatedBy):''}</small></div>` : ''}
        </div>
      </div>
      ${datalists()}
      <div class="timeline">${timelineHtml}</div>
      <div class="filter-row">
        <label class="toggle-label"><input type="checkbox" id="hide-done" ${view.hideDone?'checked':''}> 未完了のみ表示</label>
        <span class="hint" style="margin:0">タスク名を押すと、やること・根拠・期限の決め方が開きます。</span>
      </div>
      ${sectionsHtml}
      <div class="memo-box">
        <label for="memo">引き継ぎ・連絡メモ</label>
        <textarea id="memo" placeholder="ご家族からの要望、連携先からの連絡事項など">${escapeHtml(r.memo||'')}</textarea>
      </div>
      <div class="footer-bar"><span class="save-status" role="status"></span></div>`;
  }

  /* ================= ポップアップ ================= */
  const modalRoot = document.getElementById('modal-root');
  let modalHandlers = {};
  let lastFocus = null;

  function openModal({title, body, foot='', size=''}, handlers={}){
    if(!modalRoot.innerHTML) lastFocus = document.activeElement;
    modalHandlers = handlers;
    modalRoot.innerHTML = `
      <div class="modal-backdrop" data-modal-backdrop>
        <div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-head"><h2 id="modal-title">${title}</h2><button class="modal-close" data-m="close" aria-label="閉じる">×</button></div>
          <div class="modal-body">${body}</div>
          ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
        </div>
      </div>`;
    const first = modalRoot.querySelector('[data-autofocus]') || modalRoot.querySelector('.modal-foot .btn-primary') || modalRoot.querySelector('.modal-close');
    if(first) first.focus();
  }
  function closeModal(){
    modalRoot.innerHTML = ''; modalHandlers = {};
    if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  modalRoot.addEventListener('click', e=>{
    if(e.target.matches('[data-modal-backdrop]')){ closeModal(); return; }
    const el = e.target.closest('[data-m]');
    if(!el) return;
    const key = el.dataset.m;
    if(key === 'close'){ closeModal(); return; }
    if(modalHandlers[key]) modalHandlers[key](el);
  });
  document.addEventListener('keydown', e=>{
    if(!modalRoot.innerHTML) return;
    if(e.key === 'Escape'){ closeModal(); return; }
    if(e.key === 'Tab'){
      const f = [...modalRoot.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);
      if(!f.length) return;
      const first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* --- お知らせ・確認（ブラウザ標準の小窓の代わり） --- */
  function showMessage(title, message){
    openModal({ title:escapeHtml(title), body:`<p style="margin:0">${escapeHtml(message)}</p>`, size:'modal-sm',
      foot:`<button class="btn btn-primary" data-m="close">わかりました</button>` });
  }
  function showConfirm(title, message, okLabel, onOk){
    openModal({ title:escapeHtml(title), body:`<p style="margin:0">${escapeHtml(message)}</p>`, size:'modal-sm',
      foot:`<button class="btn btn-ghost" data-m="close">やめる</button><button class="btn btn-danger" data-m="ok">${escapeHtml(okLabel)}</button>` },
      { ok:()=>{ closeModal(); onOk(); } });
  }
  function showRename(r){
    openModal({ title:'氏名を編集', size:'modal-sm',
      body:`<div class="field"><label for="rename-input">氏名</label><input type="text" id="rename-input" value="${escapeHtml(r.name)}" data-autofocus></div><div class="form-error" id="rename-error"></div>`,
      foot:`<button class="btn btn-ghost" data-m="close">やめる</button><button class="btn btn-primary" data-m="ok">保存する</button>` },
      { ok:()=>{
          const v = document.getElementById('rename-input').value.trim();
          if(!v){ document.getElementById('rename-error').textContent = '氏名を入力してください。'; return; }
          r.name = v; saveResident(r); closeModal(); render();
        } });
  }

  /* --- タスクの説明ポップアップ --- */
  function showTaskInfo(residentId, taskId){
    const r = getResident(residentId); if(!r) return;
    const t = findTask(r, taskId); if(!t) return;
    const cat = statusCategory(t);
    const statusText = t.done ? '完了' : cat==='overdue' ? `期限超過（${-diffDays(t.due)}日過ぎています）` : cat==='soon' ? (diffDays(t.due)===0 ? '今日が期限' : `あと${diffDays(t.due)}日`) : `あと${diffDays(t.due)}日`;
    const statusColor = t.done ? 'var(--teal-dark)' : cat==='overdue' ? 'var(--danger)' : cat==='soon' ? 'var(--clay)' : 'var(--ink)';
    const kindText = {kazan:'加算に関わる', shihyo:'在宅復帰・在宅療養支援等指標に関わる', task:'通常業務', custom:'追加したタスク'}[t.kind];

    const dueControl = t.custom
      ? `<div class="due-edit"><input type="date" id="due-edit" value="${fmtInput(t.due)}" aria-label="期限"><button class="btn btn-ghost" data-m="save-due">期限を変更</button></div>`
      : `<div class="due-edit"><input type="date" id="due-edit" value="${fmtInput(t.due)}" aria-label="期限"><button class="btn btn-ghost" data-m="save-due">この利用者だけ期限を変更</button>${t.moved?`<button class="btn-text" data-m="reset-due">元の期限（${fmtJP(t.baseDue)}）に戻す</button>`:''}</div>`;

    const body = `
      <dl class="info-grid">
        <dt>利用者</dt><dd><b>${escapeHtml(r.name)}</b></dd>
        <dt>フロア・担当</dt><dd>${escapeHtml(floorText(r))}　／　${escapeHtml(cmText(r))}</dd>
        <dt>時期</dt><dd><span class="phase-badge phase-${t.phase}">${phaseLabel(t.phase)}</span>　${kindText}</dd>
        <dt>期限</dt><dd><b>${fmtJP(t.due)}</b>　<span style="color:${statusColor}; font-weight:700">${statusText}</span>${t.moved?'<br><small>（期限を個別に変更しています）</small>':''}</dd>
        <dt>期限の決め方</dt><dd>${escapeHtml(t.timing)}</dd>
      </dl>
      ${t.desc ? `<div class="info-block"><h4>やること</h4><p>${escapeHtml(t.desc)}</p></div>` : ''}
      ${t.basis ? `<div class="info-block basis"><h4>根拠・注意点</h4><p>${escapeHtml(t.basis)}</p></div>` : ''}
      ${!t.done ? `<div><b style="font-size:13px; color:var(--ink-muted)">期限の変更</b>${dueControl}</div>` : ''}`;

    const foot = `
      ${t.custom ? `<button class="btn-danger-text spacer" data-m="delete">このタスクを削除</button>` : '<span class="spacer"></span>'}
      ${view.mode!=='detail' || view.residentId!==r.id ? `<button class="btn btn-ghost" data-m="open">${escapeHtml(r.name)}さんの画面へ</button>` : ''}
      <button class="btn ${t.done?'btn-ghost':'btn-primary'}" data-m="toggle">${t.done?'未完了に戻す':'完了にする'}</button>`;

    openModal({ title:`${KIND_TAG[t.kind]||''}${escapeHtml(t.title)}`, body, foot }, {
      toggle:()=>{ toggleDone(r, t.id, t.custom); render(); showTaskInfo(residentId, taskId); },
      'save-due':()=>{
        const v = document.getElementById('due-edit').value;
        if(!v) return;
        if(t.custom){ const ct = r.customTasks.find(c=>c.id===t.id); if(ct) ct.due = v; }
        else{ r.taskState = r.taskState || {}; r.taskState[t.id] = { ...(r.taskState[t.id]||{}), due: v }; }
        saveResident(r); render(); showTaskInfo(residentId, taskId);
      },
      'reset-due':()=>{ const st = r.taskState[t.id]; if(st){ delete st.due; } saveResident(r); render(); showTaskInfo(residentId, taskId); },
      delete:()=>{ showConfirm('タスクの削除', `「${t.title}」を削除します。元に戻せません。`, '削除する', ()=>{ r.customTasks = r.customTasks.filter(c=>c.id!==t.id); saveResident(r); render(); }); },
      open:()=>{ closeModal(); view.mode='detail'; view.residentId=r.id; render(); window.scrollTo(0,0); }
    });
  }

  /* --- 起動時の期限お知らせ --- */
  function noticeItems(list){
    return list.map(t=>`<button class="notice-item" data-m="task" data-resident="${t.residentId}" data-id="${t.id}">
      <span class="ni-date">${fmtMD(t.due)}（${WD[t.due.getDay()]}）</span>
      <span class="ni-name">${escapeHtml(t.residentName)}<small>${escapeHtml(t.floor)}／${escapeHtml(t.cm)}</small></span>
      <span class="ni-title">${KIND_TAG[t.kind]||''}${escapeHtml(t.title)}</span>
    </button>`).join('');
  }
  function showNotice(fromStartup){
    const {overdue, soon} = collectAlerts();
    const hiddenToday = state.noticeHiddenDate === TODAY_STR;
    let body;
    if(!state.residents.length){
      body = `<div class="notice-empty">まだ利用者が登録されていません。</div>`;
    }else if(!visibleResidents().length){
      body = `<div class="notice-empty">【${escapeHtml(scopeLabel())}】に当てはまる利用者がいません。</div>`;
    }else if(!overdue.length && !soon.length){
      body = `<div class="notice-empty">期限を過ぎたタスクも、7日以内に期限が来るタスクもありません。</div>`;
    }else{
      body = `<p class="notice-lead">${scopeLabel()?`<b>【${escapeHtml(scopeLabel())}】</b>の分だけを表示しています。<br>`:''}今日 ${fmtJP(TODAY)} 時点で、期限超過 <b style="color:var(--danger)">${overdue.length}件</b>、7日以内 <b style="color:var(--clay)">${soon.length}件</b> です。タスクを押すと説明が開きます。</p>
        ${overdue.length ? `<div class="notice-group overdue"><h3>期限超過　${overdue.length}件</h3>${noticeItems(overdue)}</div>` : ''}
        ${soon.length ? `<div class="notice-group soon"><h3>今日〜7日後　${soon.length}件</h3>${noticeItems(soon)}</div>` : ''}`;
    }
    const foot = `
      <label class="toggle-label spacer"><input type="checkbox" id="hide-notice" ${hiddenToday?'checked':''}> 今日は開いたときに表示しない</label>
      ${overdue.length||soon.length ? `<button class="btn btn-ghost" data-m="to-table">タスク一覧で見る</button>` : ''}
      <button class="btn btn-primary" data-m="close">閉じる</button>`;
    openModal({ title: fromStartup ? '今日の期限のお知らせ' : '期限のお知らせ', body, foot }, {
      task:(el)=>showTaskInfo(el.dataset.resident, el.dataset.id),
      'to-table':()=>{
        closeModal(); view.mode='list'; view.residentId=null; view.tab='tasks';
        view.taskFilters = {residentId:'all', phase:'all', status: overdue.length ? 'overdue' : 'soon', kind:'all'};
        render();
      }
    });
    const cb = document.getElementById('hide-notice');
    cb.addEventListener('change', ()=>{ state.noticeHiddenDate = cb.checked ? TODAY_STR : null; savePrefs(); });
  }
  function maybeShowStartupNotice(){
    if(state.noticeHiddenDate === TODAY_STR) return;
    const {overdue, soon} = collectAlerts();
    if(overdue.length || soon.length) showNotice(true);
  }

  /* --- 加算の表示設定 --- */
  function showSettings(){
    const st = settings();
    const body = `
      <p style="margin:0 0 8px">おおやけの里が全員に算定している加算（科学的介護推進体制加算Ⅱ・自立支援促進加算・在宅復帰・在宅療養支援機能加算Ⅱ）のタスクは常に表示します。<br>下の加算は、算定していない場合に外すと一覧がすっきりします。</p>
      ${OPTIONAL_GROUPS.map(g=>`<label class="setting-item"><input type="checkbox" data-setting="${g.key}" ${st[g.key]?'checked':''}><span><b>${g.label}</b><small>${g.note}</small></span></label>`).join('')}
      <p class="hint">外しても、完了の記録は消えません。戻せばそのまま表示されます。全利用者に共通の設定です。</p>`;
    openModal({ title:'加算の表示設定', body, foot:`<button class="btn btn-ghost" data-m="close">やめる</button><button class="btn btn-primary" data-m="ok">反映する</button>` }, {
      ok:()=>{
        modalRoot.querySelectorAll('[data-setting]').forEach(cb=>{ st[cb.dataset.setting] = cb.checked; });
        saveSettings(); closeModal(); render();
      }
    });
  }

  /* ================= 操作 ================= */
  app.addEventListener('click', e=>{
    const el = e.target.closest('[data-action],[data-status]');
    if(!el) return;
    if(el.dataset.status){
      const status = el.dataset.status;
      view.tab = status === 'cards' ? 'cards' : 'tasks';
      view.taskFilters = {residentId:'all', phase:'all', status: status==='cards' ? 'all' : status, kind:'all'};
      render(); return;
    }
    const a = el.dataset.action;
    const r = el.dataset.resident ? getResident(el.dataset.resident) : getResident(view.residentId);
    switch(a){
      case 'open': view.mode='detail'; view.residentId=el.dataset.id; render(); window.scrollTo(0,0); break;
      case 'back': view.mode='list'; view.residentId=null; render(); break;
      case 'tab': view.tab = el.dataset.tab; render(); break;
      case 'show-notice': showNotice(false); break;
      case 'refresh': refresh(true); break;
      case 'key-dialog': showKeyDialog(''); break;
      case 'clear-scope': state.scope = {floor:'all', cm:'all'}; view.taskFilters.residentId='all'; savePrefs(); render(); break;
      case 'settings': showSettings(); break;
      case 'toggle-form': view.showFormPanel = true; render(); document.getElementById('f-name').focus(); break;
      case 'cancel-form': view.showFormPanel = false; render(); break;
      case 'save-new': {
        const name = document.getElementById('f-name').value.trim();
        const adm = document.getElementById('f-admission').value;
        const dis = document.getElementById('f-discharge').value;
        const err = document.getElementById('form-error');
        if(!name || !adm){ err.textContent = '氏名と入所日は必ず入力してください。'; return; }
        if(dis && dis < adm){ err.textContent = '退所予定日は入所日より後の日付にしてください。'; return; }
        const floor = document.getElementById('f-floor').value.trim();
        const cm = document.getElementById('f-cm').value.trim();
        const nr = { id:uid('res'), name, admissionDate:adm, dischargeDate:dis||null, floor, cm, taskState:{}, customTasks:[], memo:'', rev:0 };
        state.residents.push(nr);
        view.showFormPanel = false; saveResident(nr); render(); break;
      }
      case 'toggle-phase': view.collapsedPhases[el.dataset.phase] = !view.collapsedPhases[el.dataset.phase]; render(); break;
      case 'toggle': if(r){ toggleDone(r, el.dataset.id, el.dataset.custom === 'true'); render(); } break;
      case 'info': showTaskInfo(el.dataset.resident, el.dataset.id); break;
      case 'add-task': {
        const phase = el.dataset.phase;
        const title = app.querySelector(`[data-newtask-title="${phase}"]`).value.trim();
        const due = app.querySelector(`[data-newtask-date="${phase}"]`).value;
        if(!title || !due){ showMessage('入力が足りません', 'タスク名と期限を入力してください。'); return; }
        r.customTasks = r.customTasks || [];
        r.customTasks.push({ id:uid('ct'), phase, title, due, done:false });
        saveResident(r); render(); break;
      }
      case 'rename': showRename(r); break;
      case 'delete-resident':
        showConfirm('利用者の削除', `${r.name}さんのデータ（完了の記録・メモを含む）を削除します。元に戻せません。`, '削除する', ()=>{
          state.residents = state.residents.filter(x=>x.id!==r.id);
          view.mode='list'; view.residentId=null; deleteResidentData(r.id); render();
        });
        break;
      case 'sort-table': {
        const key = el.dataset.key;
        if(view.taskSort.key === key) view.taskSort.dir = view.taskSort.dir === 'asc' ? 'desc' : 'asc';
        else view.taskSort = {key, dir:'asc'};
        render(); break;
      }
    }
  });

  app.addEventListener('change', e=>{
    const el = e.target;
    if(el.dataset.scope){ scope()[el.dataset.scope] = el.value; view.taskFilters.residentId='all'; savePrefs(); render(); return; }
    if(el.dataset.textfield){ const r = getResident(view.residentId); r[el.dataset.textfield] = el.value.trim(); saveResident(r); render(); return; }
    if(el.dataset.tablefilter){ view.taskFilters[el.dataset.tablefilter] = el.value; render(); return; }
    if(el.id === 'hide-done'){ view.hideDone = el.checked; render(); return; }
    if(el.dataset.field){
      const r = getResident(view.residentId);
      const adm = el.dataset.field === 'admissionDate' ? el.value : r.admissionDate;
      const dis = el.dataset.field === 'dischargeDate' ? el.value : r.dischargeDate;
      if(!adm || (dis && dis < adm)){
        showMessage('日付を確認してください', !adm ? '入所日は空にできません。' : '退所予定日は入所日より後の日付にしてください。');
        el.value = r[el.dataset.field] || '';
        return;
      }
      r[el.dataset.field] = el.value || null;
      saveResident(r); render();
    }
  });

  app.addEventListener('input', e=>{
    if(e.target.id === 'memo'){ const r = getResident(view.residentId); r.memo = e.target.value; saveResidentLater(r); }
  });

  app.addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    if(e.target.matches('[data-newtask-title]')){ app.querySelector(`[data-action="add-task"][data-phase="${e.target.dataset.newtaskTitle}"]`).click(); }
  });

  loadState();
})();
</script>
</body>
</html>
