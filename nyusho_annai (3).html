<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入所案内 作成ツール｜おおやけの里</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* ===== 操作画面 ===== */
:root{--fg-go:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;--fg-min:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--fg-dela:"Dela Gothic One","Zen Kaku Gothic New","Yu Gothic",sans-serif;--fg-maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;--fg-num:"Cormorant Garamond","Georgia","Times New Roman",serif;--ink:#1f2a44;--line:#d7d3c8;--bg:#f3f1ec;--acc:#2b3556;--warn:#a33;}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fg-go);background:var(--bg);color:var(--ink);font-size:14px}
header.app{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header.app h1{font-size:16px;margin:0;font-weight:700}
header.app nav button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
header.app nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main.app{padding:16px;max-width:1240px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
.grid2{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
label.f{display:block;margin:8px 0 3px;font-size:12px;color:#555}
input[type=text],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
textarea{resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:none;background:var(--acc);color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.days label{border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;background:#fff;font-size:13px}
.days input{margin-right:4px}
.note{font-size:12px;color:#666;line-height:1.6}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.qrbox{display:flex;gap:10px;align-items:center}
.qrbox img{width:80px;height:80px;border:1px solid var(--line);background:#fff;object-fit:contain}
.floortabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.floortabs button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.floortabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rt{width:100%;border-collapse:collapse;font-size:13px}.rt th,.rt td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}.rt input{padding:4px 6px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.rolegrid{grid-template-columns:1fr}}
.previewwrap{background:#888;padding:14px;border-radius:8px;overflow:auto}
.previewwrap .page{transform-origin:top left;margin:0 auto 14px}
.scaler{width:100%;}

/* ===== 印刷ページ共通 ===== */
.page{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always;break-after:page;background:#fff;font-family:var(--fg-min);font-weight:500}
.page:last-child{page-break-after:auto}
.foot{position:absolute;left:0;right:0;bottom:11mm;text-align:center;font-size:13.5pt;line-height:1.8;letter-spacing:.15em}
.foot .slogan{font-size:12.5pt;padding-bottom:4mm;margin:0 16mm 4mm;border-bottom:1px solid currentColor}
.foot .tel{font-family:var(--fg-num);font-weight:600;font-size:15pt;letter-spacing:.05em}
.note-r{position:absolute;right:16mm;bottom:11mm;font-size:12pt;letter-spacing:.15em}
.rules{list-style:none;margin:0;padding:0}
.rules li{display:flex;align-items:flex-start;gap:4mm;margin:0 0 4.5mm}
.rules .n{font-family:var(--fg-num);font-weight:500;font-style:italic;font-size:36pt;line-height:1;width:14mm;flex:none;text-align:right}
.rules .t{font-size:15.5pt;line-height:1.5;padding-top:2.5mm;font-family:var(--fg-go);font-weight:500}
.rules .t small{font-size:13.5pt}
.bath-line{position:absolute;left:0;right:0;top:114mm;text-align:center;font-size:25pt;letter-spacing:.06em}
.bath-line b{display:inline-block;min-width:12mm;font-weight:700;border-bottom:1px solid currentColor;margin:0 2mm}
.tub{position:absolute;right:22mm;bottom:52mm;width:76mm;height:auto}

.pic{position:absolute;mix-blend-mode:multiply;z-index:0}
/* --- 男性版（紺×ベージュ） --- */
.m{background:#e9e2d2;color:#2b3556}
.m .stripe{position:absolute;top:0;bottom:0;width:11mm;background:repeating-linear-gradient(-55deg,#2b3556 0 3mm,transparent 3mm 8.5mm,#2b3556 8.5mm 10.5mm,transparent 10.5mm 22mm)}
.m .stripe.l{left:0}.m .stripe.r{right:0;transform:scaleX(-1)}
.m .datebox{position:absolute;left:12mm;top:0;background:#2b3556;color:#fff;font-family:var(--fg-dela);font-weight:400;font-size:19pt;padding:2mm 6mm 2mm 4mm;letter-spacing:.03em}
.m .name{position:absolute;left:18mm;right:18mm;top:38mm;text-align:center;font-family:var(--fg-dela);font-weight:400;font-size:38pt;letter-spacing:.12em;border-bottom:1.5px solid #2b3556;padding-bottom:6mm}
.m .greet{position:absolute;left:12mm;right:12mm;top:64mm;font-size:15pt;line-height:2.2;letter-spacing:.06em}
.m .greet .big{font-family:var(--fg-dela);font-weight:400;font-size:25pt;letter-spacing:.02em;margin:0 3mm}
.m .qrframe{position:absolute;left:50%;top:119mm;transform:translateX(-50%);width:68mm;height:68mm;background:#2b3556;padding:6mm}
.m .qrframe img{width:100%;height:100%;object-fit:contain;background:#fff}
.m .qrframe .empty{width:100%;height:100%;background:#fff;color:#999;display:flex;align-items:center;justify-content:center;font-size:10pt;text-align:center;padding:4mm;font-family:sans-serif}
.m .linetext{position:absolute;left:12mm;right:12mm;top:188mm;text-align:center;font-size:14.5pt;line-height:1.75;letter-spacing:.04em}
.m .htitle{position:absolute;left:20mm;top:22mm;font-family:var(--fg-dela);font-weight:400;font-size:33pt;letter-spacing:.06em}
.m .lead{position:absolute;left:20mm;right:14mm;top:46mm;font-family:var(--fg-go);font-weight:500;font-size:15pt;line-height:1.75;letter-spacing:.04em}
.m .rulebox{position:absolute;left:13mm;right:13mm;top:86mm;padding:7mm 4mm 5mm 4mm}
.m .rulebox:before{content:"";position:absolute;left:0;top:0;width:40mm;height:40mm;border-left:1.2px solid #2b3556;border-top:1.2px solid #2b3556}
.m .rulebox:after{content:"";position:absolute;right:0;bottom:0;width:40mm;height:40mm;border-right:1.2px solid #2b3556;border-bottom:1.2px solid #2b3556}
.m .rules .n{color:#2b3556}

.m .ttl{position:absolute;left:18mm;right:18mm;top:26mm;text-align:center;font-family:var(--fg-dela);font-weight:400;font-size:31pt;letter-spacing:.08em;border-bottom:1.5px solid #2b3556;padding-bottom:5mm}
.m .team{position:absolute;left:12mm;right:12mm;top:60mm;height:200mm}
.m .center{overflow:hidden;position:absolute;left:50%;top:50%;width:70mm;height:70mm;margin:-35mm 0 0 -35mm;border:1.5px solid #2b3556;border-radius:50%;background:#e9e2d2;z-index:2}
.m .center svg{width:100%;height:100%}
.m .box{position:absolute;width:44mm;height:29mm;background:#2b3556;color:#fff;padding:2mm 3mm;z-index:2}
.m .box .r{font-size:12pt;letter-spacing:.2em;display:block}
.m .box .nm{font-family:var(--fg-dela);font-weight:400;font-size:23pt;line-height:1.1;display:block;text-align:center;margin-top:1mm;white-space:nowrap}
.m .box .nm.long{font-size:17pt}
.m .spoke{position:absolute;left:50%;top:50%;height:1.2px;background:#2b3556;transform-origin:0 50%;z-index:1}

/* --- 女性版（茶×クリーム） --- */
.w{background:#fdf8ec;color:#5a3418}
.w .fl{position:absolute;width:34mm;height:34mm;opacity:.9}
.w .fl.tl{left:2mm;top:2mm}.w .fl.br{right:2mm;bottom:2mm;transform:rotate(180deg)}
.w .htitle{position:absolute;left:18mm;right:18mm;top:20mm;text-align:center;font-family:var(--fg-maru);font-weight:900;font-size:33pt;letter-spacing:.06em}
.w .htitle:after{content:"";display:block;margin:3mm auto 0;width:120mm;border-bottom:2.5px dotted #2e5a3e}
.w .lead{position:absolute;left:42mm;right:10mm;top:46mm;font-family:var(--fg-go);font-weight:500;font-size:15pt;line-height:1.75}
.w .rulebox{position:absolute;left:11mm;right:11mm;top:84mm;padding:7mm 4mm 5mm 4mm}
.w .rulebox:before{content:"";position:absolute;left:0;top:0;width:40mm;height:40mm;border-left:1.2px solid #5a3418;border-top:1.2px solid #5a3418}
.w .rulebox:after{content:"";position:absolute;right:0;bottom:0;width:40mm;height:40mm;border-right:1.2px solid #5a3418;border-bottom:1.2px solid #5a3418}

.w .datebox{position:absolute;right:20mm;top:12mm;font-family:var(--fg-maru);font-weight:700;font-size:18pt;letter-spacing:.2em}
.w .name{position:absolute;left:8mm;right:8mm;top:62mm;text-align:center;font-family:var(--fg-maru);font-weight:900;font-size:29pt;letter-spacing:.03em;white-space:nowrap}
.w .prog{position:absolute;left:20mm;right:20mm;font-family:var(--fg-go)}
.w .prog h3{margin:0 0 3mm;font-size:17pt;letter-spacing:.15em;color:#2e5a3e;font-weight:900;font-family:var(--fg-maru)}
.w .prog p{margin:0;font-size:14.5pt;line-height:1.8;letter-spacing:.05em;white-space:pre-wrap}
.w .prog.p1{top:92mm;left:90mm;right:12mm}.w .prog.p2{top:143mm;right:88mm}.w .prog.p3{top:200mm;left:90mm;right:12mm}
.w .ill{position:absolute;width:38mm;height:38mm}
.w .greet{position:absolute;left:40mm;right:6mm;top:50mm;font-family:var(--fg-go);font-weight:500;font-size:15pt;line-height:2.2;letter-spacing:0}
.w .greet .big{font-family:var(--fg-maru);font-weight:900;font-size:30pt;letter-spacing:.02em;margin:0 3mm}
.w .qrframe{position:absolute;left:104mm;top:119mm;width:64mm;height:64mm;background:#f2dede;padding:5mm;transform:rotate(-1.5deg)}
.w .qrframe img{width:100%;height:100%;object-fit:contain;background:#fff}
.w .qrframe .empty{width:100%;height:100%;background:#fff;color:#999;display:flex;align-items:center;justify-content:center;font-size:10pt;text-align:center;padding:4mm;font-family:sans-serif}
.w .linetext{position:absolute;left:44mm;right:8mm;top:185mm;font-family:var(--fg-go);font-weight:500;font-size:15pt;line-height:2;letter-spacing:.01em}
.w .team{position:absolute;left:12mm;right:12mm;top:56mm;height:200mm}
.w .ring{z-index:0;position:absolute;left:50%;top:50%;width:150mm;height:150mm;margin:-75mm 0 0 -75mm;border:1.5px solid #5a3418;border-radius:50%}
.w .center{position:absolute;left:50%;top:50%;width:80mm;height:80mm;margin:-40mm 0 0 -40mm}
.w .center svg{width:100%;height:100%}
.w .circ{position:absolute;width:44mm;height:44mm;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--fg-maru);color:#5a3418;z-index:2}
.w .circ .r{font-size:13.5pt;line-height:1.2;font-weight:700}
.w .circ .nm{font-weight:900;font-size:23pt;line-height:1.1;margin-top:1mm;white-space:nowrap}
.w .circ .nm.long{font-size:17pt}
.w .bath-line{font-family:var(--fg-maru);font-weight:700;top:110mm;text-align:left;left:20mm;right:8mm;line-height:2.4;font-size:23pt;white-space:nowrap}


.apptitle{position:absolute;left:18mm;right:18mm;top:24mm;text-align:center;font-size:30pt;font-weight:900;letter-spacing:.06em}
.m .apptitle{font-family:var(--fg-dela);font-weight:400;border-bottom:1.5px solid #2b3556;padding-bottom:5mm}
.w .apptitle{font-family:var(--fg-maru);top:22mm;left:40mm;right:14mm}
.w .apptitle:after{content:"";display:block;margin:3mm auto 0;width:120mm;border-bottom:2.5px dotted #2e5a3e}
.applead{position:absolute;left:16mm;right:16mm;top:52mm;text-align:center;font-family:var(--fg-go);font-weight:500;font-size:14.5pt;line-height:1.9}
.appqr{position:absolute;left:50%;top:78mm;transform:translateX(-50%);width:62mm;height:62mm;background:#fff;padding:3mm;border:1.5mm solid currentColor;border-radius:3mm}
.appqr img{width:100%;height:100%;image-rendering:pixelated}
.appurl{position:absolute;left:0;right:0;top:144mm;text-align:center;font-family:var(--fg-num);font-weight:600;font-size:11pt;letter-spacing:.02em}
.appsteps{position:absolute;left:18mm;right:16mm;top:154mm;list-style:none;margin:0;padding:0;font-family:var(--fg-go);font-weight:500}
.appsteps li{display:flex;gap:4mm;align-items:flex-start;margin-bottom:3mm}
.appsteps .n{flex:none;width:9mm;height:9mm;line-height:9mm;border-radius:50%;background:currentColor;text-align:center;font-weight:900;font-size:13pt;position:relative}
.m .appsteps .n{color:#2b3556}.m .appsteps .n:after,.w .appsteps .n:after{content:attr(data-n)}
.appsteps .n span{position:absolute;inset:0;color:#fff}
.appsteps .t{font-size:13.5pt;line-height:1.6;padding-top:.5mm}
.appnote{position:absolute;left:18mm;right:16mm;top:222mm;font-family:var(--fg-go);font-weight:500;font-size:11.5pt;line-height:1.75}
@media screen{.printarea{display:none}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  header.app,main.app,.toast{display:none!important}
  .printarea{display:block}
  .page{box-shadow:none}
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="app">
  <h1>入所案内 作成ツール</h1>
  <nav>
    <button id="tabMake" class="on" onclick="showPanel('make')">作成</button>
    <button id="tabSet" onclick="showPanel('set')">フロア設定</button>
  </nav>
</header>

<main class="app">

<!-- ========== 作成 ========== -->
<section id="panelMake" class="panel on">
<div class="grid2">
  <div>
    <div class="card">
      <h2>ご利用者情報</h2>
      <label class="f">デザイン</label>
      <div class="row">
        <select id="design"><option value="m">男性版（紺）</option><option value="w">女性版（花）</option></select>
      </div>
      <label class="f">氏名</label>
      <input type="text" id="name" placeholder="例：上田　良雄">
      <div class="row">
        <div><label class="f">入所日</label><input type="date" id="date"></div>
        <div><label class="f">フロア</label><select id="floor"></select></div>
      </div>
      <div class="row">
        <div><label class="f">部屋番号</label><input type="text" id="room" list="dl_room" placeholder="例：407" oninput="onRoomInput()"><datalist id="dl_room"></datalist></div>
      </div>
    </div>

    <div class="card">
      <h2>担当職員（フロア名簿から選択）</h2>
      <div class="rolegrid" id="roleInputs"></div>
      <p class="note">部屋番号を入れると、居室担当表から介護・看護が自動で入ります。名簿にない人は直接入力できます。空欄にするとその枠は名前なしで印刷されます。</p>
    </div>

    <div class="card">
      <h2>入浴曜日（フロア設定から自動入力）</h2>
      <div class="days" id="bathDays"></div>
    </div>

    <div class="card" id="progCard">
      <h2>サポートプログラム（女性版のみ）</h2>
      <label class="f">リハビリテーション</label>
      <textarea id="prog1" rows="3"></textarea>
      <label class="f">安心できる暮らし</label>
      <textarea id="prog2" rows="3"></textarea>
      <label class="f">生活を楽しむ</label>
      <textarea id="prog3" rows="2"></textarea>
    </div>

    <div class="card">
      <button class="btn" onclick="doPrint()">印刷・PDF保存</button>
      <button class="btn sub" onclick="clearForm()">入力を消す</button>
      <p class="note">印刷ダイアログで「背景のグラフィック」を有効にしてください。用紙はA4、余白なしで出力されます。</p>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>プレビュー</h2>
      <div class="previewwrap"><div id="preview"></div></div>
    </div>
  </div>
</div>
</section>

<!-- ========== 設定 ========== -->
<section id="panelSet" class="panel">
  <div class="card">
    <h2>フロア別設定</h2>
    <div class="floortabs" id="floorTabs"></div>
    <div id="floorEditor"></div>
  </div>
  <div class="card">
    <h2>設定の保存・共有</h2>
    <p class="note">設定はこの端末のブラウザに保存されます。別の端末で使う場合は書き出したファイルを読み込んでください。</p>
    <div class="row" style="margin-top:8px">
      <button class="btn sub" onclick="exportSettings()">設定を書き出す</button>
      <label class="btn sub" style="text-align:center">設定を読み込む<input type="file" accept=".json" style="display:none" onchange="importSettings(this)"></label>
      <button class="btn danger" onclick="resetSettings()">初期状態に戻す</button>
    </div>
  </div>
</section>

</main>

<div class="printarea" id="printarea"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= データ ================= */
const FLOORS = ["本館2階","本館3階","本館4階","新館2階","新館3階"];
const ROLES = ["医師","ケアマネ","看護","介護","リハビリ","栄養士","相談員","退所支援"];

  return defaultSettings();
}
function saveSettings(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); toast("保存しました"); }catch(e){ toast("保存できません。QR画像が大きすぎる可能性があります"); } }

/* ================= 画面切替 ================= */
function showPanel(p){
  document.getElementById("panelMake").classList.toggle("on",p==="make");
  document.getElementById("panelSet").classList.toggle("on",p==="set");
  document.getElementById("tabMake").classList.toggle("on",p==="make");
  document.getElementById("tabSet").classList.toggle("on",p==="set");
  if(p==="make"){ fillRoleInputs(true); render(); }
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

/* ================= 設定画面 ================= */
let curFloor = FLOORS[0];
function buildFloorTabs(){
  const w=document.getElementById("floorTabs"); w.innerHTML="";
  FLOORS.forEach(f=>{ const b=document.createElement("button"); b.textContent=f; b.className=f===curFloor?"on":""; b.onclick=()=>{curFloor=f;buildFloorTabs();buildFloorEditor();}; w.appendChild(b); });
}
function buildFloorEditor(){
  const fs=S.floors[curFloor]; const e=document.getElementById("floorEditor");
  let h=`<label class="f">LINE QRコード画像（${curFloor}のフロアアカウント）</label>
  <div class="qrbox">${fs.qr?`<img src="${fs.qr}">`:`<div style="width:80px;height:80px;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999">未登録</div>`}
  <label class="btn sub">画像を選ぶ<input type="file" accept="image/*" style="display:none" onchange="setQr(this)"></label>
  ${fs.qr?`<button class="btn sub" onclick="clearQr()">削除</button>`:""}</div>
  <label class="f">入浴曜日</label><div class="days">`;
  DAYS.forEach(d=>{ h+=`<label><input type="checkbox" ${fs.bath.includes(d)?"checked":""} onchange="toggleBath('${d}',this.checked)">${d}</label>`; });
  h+=`</div><label class="f" style="margin-top:14px">職員名簿（役職ごとに1行1名、または「、」区切り）</label><div class="rolegrid">`;
  ROLES.forEach(r=>{ h+=`<div><label class="f">${r}</label><textarea rows="2" onchange="setStaff('${r}',this.value)">${fs.staff[r].join("\n")}</textarea></div>`; });
  h+=`</div><label class="f" style="margin-top:14px">居室担当表（部屋番号→介護・看護の担当。部屋を選ぶと自動入力されます）</label><table class="rt"><thead><tr><th>部屋</th><th>介護（居室担当）</th><th>看護（受け持ち）</th><th></th></tr></thead><tbody>`;
  Object.keys(fs.rooms).sort().forEach(rm=>{ const v=fs.rooms[rm]; h+=`<tr><td><b>${rm}</b></td><td><input type="text" value="${v[0]||""}" onchange="setRoom('${rm}',0,this.value)"></td><td><input type="text" value="${v[1]||""}" onchange="setRoom('${rm}',1,this.value)"></td><td><button class="btn sub" onclick="delRoom('${rm}')">削除</button></td></tr>`; });
  h+=`</tbody></table><div class="row" style="margin-top:6px;max-width:320px"><input type="text" id="newRoom" placeholder="部屋番号を追加（例：259）"><button class="btn sub" onclick="addRoom()">追加</button></div>`;
  h+=`<div style="margin-top:12px"><button class="btn" onclick="saveSettings()">この設定を保存</button></div>`;
  e.innerHTML=h;
}
function setQr(inp){
  const f=inp.files[0]; if(!f) return;
  const img=new Image(); const rd=new FileReader();
  rd.onload=ev=>{ img.onload=()=>{ const c=document.createElement("canvas"); const max=600; let w=img.width,hh=img.height; const k=Math.min(1,max/Math.max(w,hh)); c.width=Math.round(w*k); c.height=Math.round(hh*k); const cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height); cx.drawImage(img,0,0,c.width,c.height); S.floors[curFloor].qr=c.toDataURL("image/png"); saveSettings(); buildFloorEditor(); }; img.src=ev.target.result; };
  rd.readAsDataURL(f);
}
function setRoom(rm,i,v){ S.floors[curFloor].rooms[rm][i]=v.trim(); }
function delRoom(rm){ delete S.floors[curFloor].rooms[rm]; buildFloorEditor(); }
function addRoom(){ const v=document.getElementById("newRoom").value.trim(); if(!v) return; if(!S.floors[curFloor].rooms[v]) S.floors[curFloor].rooms[v]=["",""]; buildFloorEditor(); }
function clearQr(){ S.floors[curFloor].qr=""; saveSettings(); buildFloorEditor(); }
function toggleBath(d,on){ const a=S.floors[curFloor].bath; const i=a.indexOf(d); if(on&&i<0) a.push(d); if(!on&&i>=0) a.splice(i,1); S.floors[curFloor].bath=DAYS.filter(x=>a.includes(x)); }
function setStaff(r,v){ S.floors[curFloor].staff[r]=v.split(/[\n、,，]/).map(s=>s.trim()).filter(Boolean); }
function exportSettings(){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="nyusho_annai_settings.json"; a.click(); }
function importSettings(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=ev=>{ try{ const o=JSON.parse(ev.target.result); if(!o.floors) throw 0; S=o; localStorage.setItem(KEY,JSON.stringify(S)); S=loadSettings(); buildFloorEditor(); toast("読み込みました"); }catch(e){ toast("読み込めませんでした。ファイル形式を確認してください"); } }; rd.readAsText(f); inp.value=""; }
function resetSettings(){ if(!confirm("全フロアの設定を消します。よろしいですか。")) return; S=defaultSettings(); localStorage.removeItem(KEY); buildFloorEditor(); toast("初期状態に戻しました"); }

/* ================= 作成画面 ================= */
const $=id=>document.getElementById(id);
function fillRoleInputs(keep){
  const fl=$("floor").value; const fs=S.floors[fl]; const w=$("roleInputs");
  const prev={}; if(keep) ROLES.forEach(r=>{ const el=$("role_"+r); if(el) prev[r]=el.value; });
  w.innerHTML="";
  ROLES.forEach(r=>{
    let list=fs.staff[r]; if(r==="介護"||r==="看護"){ const i=r==="介護"?0:1; list=[...new Set([...list,...Object.values(fs.rooms).map(v=>v[i]).filter(Boolean)])]; } const id="role_"+r;
    let h=`<div><label class="f">${r}</label><input type="text" id="${id}" list="dl_${r}" oninput="render()" placeholder="${list.length?"選択または入力":"名簿未登録"}"><datalist id="dl_${r}">`;
    list.forEach(n=>h+=`<option value="${n}">`); h+=`</datalist></div>`;
    w.insertAdjacentHTML("beforeend",h);
    // 名簿が1名のときは自動入力、それ以外は前回値を維持
    $(id).value = prev[r] !== undefined ? prev[r] : (list.length===1?list[0]:"");
  });
}
function fillBathDays(fromFloor){
  const fl=$("floor").value; const fs=S.floors[fl]; const w=$("bathDays"); w.innerHTML="";
  DAYS.forEach(d=>{ w.insertAdjacentHTML("beforeend",`<label><input type="checkbox" value="${d}" ${fs.bath.includes(d)?"checked":""} onchange="render()">${d}</label>`); });
}
function fillRoomList(){ const fs=S.floors[$("floor").value]; $("dl_room").innerHTML=Object.keys(fs.rooms).sort().map(r=>`<option value="${r}">`).join(""); }
function onRoomInput(){ const fs=S.floors[$("floor").value]; const v=fs.rooms[$("room").value.trim()]; if(v){ if(v[0]) $("role_介護").value=v[0]; if(v[1]) $("role_看護").value=v[1]; } render(); }

function clearForm(){ $("name").value=""; $("room").value=""; ROLES.forEach(r=>$("role_"+r).value=""); render(); }
function fmtDate(v){ if(!v) return {y:"　　",m:"　",d:"　"}; const [y,m,d]=v.split("-"); return {y,m:String(+m),d:String(+d)}; }
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function form(){
  const o={ design:$("design").value, name:$("name").value.trim(), date:$("date").value, floor:$("floor").value, room:$("room").value.trim(), staff:{},
    bath:[...document.querySelectorAll("#bathDays input:checked")].map(i=>i.value),
    prog:[$("prog1").value,$("prog2").value,$("prog3").value] };
  ROLES.forEach(r=>o.staff[r]=$("role_"+r).value.trim());
  return o;
}
function splitFloor(f){ const m=f.match(/^(本館|新館)(\d)階$/); return m?{b:m[1],f:m[2]}:{b:f,f:""}; }

function pagesM(o){
  const fs=S.floors[o.floor]; const d=fmtDate(o.date); const fl=splitFloor(o.floor);
  const stripes=`<div class="stripe l"></div><div class="stripe r"></div>`;
  const p=[];
  p.push(`<div class="page m">${stripes}
    <div class="datebox">ご入所日：${d.y}年 ${d.m}月 ${d.d}日</div>
    <div class="name">${esc(o.name)||"　"}様</div>
    <div class="greet">この度は、おおやけの里にご入所いただきありがとうございます。<br>今回のお部屋は<span class="big">${esc(fl.b)}${esc(fl.f)}</span>階<span class="big">${esc(o.room)||"　"}</span>号室です。<br>スタッフ一同、心を込めて引き続きサポートさせていただきます。<br>どうぞ宜しくお願い致します。</div>
    <div class="qrframe">${qrHtml(fs,o.floor)}</div>
    <div class="linetext">LINEでのビデオ通話による面会を行っております。<br>QRコードを読み取り、お友達登録をお願いします。<br>ご登録の際は、ご家族様のお名前と続柄をメッセージに<br>送信してくださいますよう、よろしくお願い致します。<br>また、対面での面会を再開致しました。<br>詳細は別紙にてご確認ください。</div>
    ${FOOT_M}</div>`);
  p.push(`<div class="page m"><div class="htitle">対面の面会について</div>
    <div class="lead">対面での面会を段階的ではありますが、開始しております。<br>今後、感染症の発生に伴い、面会を中止させていただく場合もございますが、下記の項目の厳守にご協力頂きますようお願い致します。</div>
    <div class="rulebox">${rulesHtml(MENKAI_RULES)}</div></div>`);
  p.push(`<div class="page m"><div class="htitle">外出・外泊について</div>
    <div class="lead">今までは冠婚葬祭もしくは特別な事情に限り入所中の外出が可能でしたが、今後は入所中の外出や外泊が可能となります。<br>なお、下記の項目の厳守にご協力頂きますようお願い致します。</div>
    <div class="rulebox">${rulesHtml(GAISHUTSU_RULES)}<div style="margin:2mm 0 0 10mm;font-family:var(--fg-go);font-weight:500;font-size:15pt">※感染症にはくれぐれもお気をつけください。</div></div></div>`);
  p.push(`<div class="page m">${stripes}${appPage("m")}${FOOT_M.replace(/<div class="slogan">.*?<\/div>/,"")}</div>`);

    <div class="tub">${TUB_SVG}</div>
    <div class="note-r">※入浴日は変更になる場合がございます。</div></div>`);
  return p;
}

/* ---- 描画・印刷 ---- */
function render(){
  const o=form(); $("progCard").style.display=o.design==="w"?"":"none";
  const pages=(o.design==="w"?pagesW(o):pagesM(o)).join("");
  const pv=$("preview"); pv.innerHTML=pages;
  const wrap=pv.parentElement; const avail=wrap.clientWidth-28; const pw=793.7; const k=Math.min(1,avail/pw);
  pv.querySelectorAll(".page").forEach(pg=>{ pg.style.transform=`scale(${k})`; pg.style.marginBottom=`calc(${(k-1)*297}mm + 14px)`; pg.style.boxShadow="0 2px 10px rgba(0,0,0,.4)"; });
  pv.style.width=(pw*k)+"px"; pv.style.margin="0 auto";
  $("printarea").innerHTML=pages;
}
function doPrint(){ const o=form(); if(!o.name){ if(!confirm("氏名が空欄です。このまま印刷しますか。")) return; } render(); (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>window.print()); }

/* ---- 初期化 ---- */
(function init(){
  const fsel=$("floor"); FLOORS.forEach(f=>{ const op=document.createElement("option"); op.value=f; op.textContent=f; fsel.appendChild(op); });
  fsel.onchange=onFloorChange; $("design").onchange=render;
  ["name","date","prog1","prog2","prog3"].forEach(id=>$(id).addEventListener("input",render));
  $("prog1").value=PROG_DEFAULT[0]; $("prog2").value=PROG_DEFAULT[1]; $("prog3").value=PROG_DEFAULT[2];
  const t=new Date(); $("date").value=t.toISOString().slice(0,10);
  buildFloorTabs(); buildFloorEditor(); fillRoleInputs(); fillBathDays(); fillRoomList(); render();
  window.addEventListener("resize",render);
})();
</script>
