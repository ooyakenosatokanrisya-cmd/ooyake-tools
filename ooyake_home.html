<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#f5f5f3;color:#2c2c2a;font-size:14px;display:flex;flex-direction:column;overflow:hidden;}

.hdr{background:#006E99;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex-shrink:0;}
.hdr-logo{height:26px;width:auto;cursor:pointer;display:block;background:#fff;border-radius:5px;padding:2px 4px;}
.hdr-title{font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;}
.hdr-sub{font-size:11px;color:#B2E5F7;white-space:nowrap;}
.hdr-sp{flex:1;}
.search{background:rgba(255,255,255,.14);border:none;color:#fff;padding:7px 11px;border-radius:8px;font-size:13px;font-family:inherit;width:190px;}
.search::placeholder{color:#B2E5F7;}
.search:focus{outline:none;background:rgba(255,255,255,.24);}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:none;padding:6px 11px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.hbtn:hover{background:rgba(255,255,255,.26);}
.hbtn.on{background:#fff;color:#006E99;font-weight:600;}

.roles{background:#fff;border-bottom:0.5px solid rgba(0,0,0,.1);padding:0 14px;display:flex;gap:2px;overflow-x:auto;flex-shrink:0;}
.role{padding:10px 15px;border:none;background:none;font-size:13px;font-weight:500;color:#888780;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;}
.role:hover{color:#009EDB;}
.role.on{color:#006E99;border-bottom-color:#009EDB;}
.role .n{font-size:11px;color:#B4B2A9;margin-left:4px;}

.tabs{background:#eceae4;border-bottom:0.5px solid rgba(0,0,0,.1);padding:5px 14px;display:none;gap:5px;overflow-x:auto;flex-shrink:0;align-items:center;}
.tabs.on{display:flex;}
.tab{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:7px 7px 0 0;padding:5px 8px 5px 11px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;color:#5F5E5A;font-family:inherit;}
.tab.on{border-color:#009EDB;color:#006E99;font-weight:600;}
.tab .x{color:#B4B2A9;font-size:14px;line-height:1;}
.tab .x:hover{color:#E24B4A;}
.tab-home{background:none;border:none;color:#5F5E5A;font-size:12px;cursor:pointer;padding:5px 9px;font-family:inherit;white-space:nowrap;}
.tab-home:hover{color:#009EDB;}

.main{flex:1;position:relative;overflow:hidden;}
.pane{position:absolute;inset:0;overflow-y:auto;background:#f5f5f3;display:none;}
.pane.on{display:block;}
.frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;display:none;}
.frame.on{display:block;}
.fbox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#f5f5f3;padding:1.5rem;}
.fbox.on{display:flex;}
.fbox-in{background:#fff;border:0.5px solid rgba(0,0,0,.1);border-radius:12px;padding:1.5rem;max-width:430px;text-align:center;}

.home{padding:1.25rem 14px 3rem;max-width:1080px;margin:0 auto;}
.lead{font-size:13px;color:#5F5E5A;line-height:1.8;margin-bottom:1rem;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;}
.card{background:#fff;border:0.5px solid rgba(0,0,0,.1);border-radius:12px;padding:1rem;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:#009EDB;box-shadow:0 2px 12px rgba(0,158,219,.10);}
.card.hid{opacity:.5;}
.c-ico{font-size:24px;line-height:1;margin-bottom:8px;}
.c-name{font-size:15px;font-weight:600;margin-bottom:3px;}
.c-desc{font-size:12px;color:#888780;line-height:1.6;}
.c-foot{display:flex;align-items:center;gap:8px;margin-top:9px;}
.tag{font-size:10px;color:#5F5E5A;background:#f5f5f3;border-radius:4px;padding:2px 7px;}
.ext{font-size:11px;color:#009EDB;text-decoration:none;margin-left:auto;}
.ext:hover{text-decoration:underline;}
.edit{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:0.5px dashed rgba(0,0,0,.12);flex-wrap:wrap;}
.edit select{padding:4px 7px;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;font-size:12px;font-family:inherit;background:#fff;}
.mini{background:#fff;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit;}
.mini:hover{background:#f5f5f3;}
.empty{background:#fff;border:0.5px dashed rgba(0,0,0,.15);border-radius:12px;padding:20px;text-align:center;color:#888780;font-size:13px;}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;align-items:center;justify-content:center;padding:1rem;}
.ov.on{display:flex;}
.modal{background:#fff;border-radius:12px;padding:1.4rem;width:520px;max-width:100%;max-height:88vh;overflow-y:auto;}
.mt{font-size:16px;font-weight:600;margin-bottom:1rem;}
.fg{margin-bottom:.85rem;}
.fl{font-size:12px;color:#888780;margin-bottom:4px;display:block;}
.fc{width:100%;padding:8px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;font-size:13px;font-family:inherit;}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:1.1rem;}
.b1{background:#009EDB;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
.b2{background:#fff;color:#5F5E5A;border:0.5px solid rgba(0,0,0,.2);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
.b3{background:#fff;color:#A32D2D;border:0.5px solid rgba(163,45,45,.3);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
.hint{font-size:11px;color:#888780;line-height:1.7;margin-top:6px;}
@media(max-width:640px){.home{padding:1rem 11px 2.5rem;}.hdr-sub{display:none;}.search{width:120px;}}
</style>
</head>

<script>
/* ============================================================
   おおやけの里　業務システム（外枠）
   各ツールは別々のHTMLのまま、この画面の中で開きます。
   ツールの追加・区分の変更・並べ替え・非表示は「編集」から行えます。
   ============================================================ */
const BASE_DEFAULT='https://ooyakenosatokanrisya-cmd.github.io/ooyake-tools/';
const PASS_DEFAULT='ooyake2026';
const K={base:'ooyake_home_base_v2',pass:'ooyake_home_pass_v2',layout:'ooyake_home_layout_v2',
         custom:'ooyake_home_custom_v2',role:'ooyake_home_role_v2',multi:'ooyake_home_multi_v2'};

const ROLES=[
  {id:'soudan',name:'相談員が使う',  desc:'記録を入れる画面です。毎日使います。'},
  {id:'kanri', name:'管理職が見る',  desc:'数字を確認する画面です。会議や報告で使います。'},
  {id:'gaibu', name:'紹介元に見せる',desc:'外部の事業所に案内する画面です。'},
  {id:'other', name:'そのほか',      desc:'使う頻度が低い道具です。'}
];

/* 標準のツール。公開しているファイル名が違う場合は「編集」から直せます。 */
const BUILTIN=[
  {file:'nyusho_input_app.html',         name:'入所管理　入力・進捗',    roles:['soudan'], icon:'📝', tag:'入力する', desc:'ケースの登録と編集、段階ごとの進捗確認を行います。'},
  {file:'mensetsu_assessment.html',      name:'入所前面接・アセスメント', roles:['soudan'], icon:'🗒️', tag:'入力する', desc:'面接時の聞き取り内容を記録します。'},
  {file:'eigyo_nippo_master.html',       name:'営業日報',                roles:['soudan','kanri'], icon:'🚗', tag:'入力する', desc:'訪問記録の入力、統計・分析、事業所別の訪問と申込の実績を見ます。'},
  {file:'https://ooyakenosatokanrisya-cmd.github.io/soudan-okuri/', name:'相談員 申し送り', roles:['soudan'], icon:'🔁', tag:'入力する', desc:'相談員どうしの申し送りを記録し、共有します。'},
  {file:'oyake_bed_management_fix.html', name:'ベッド管理・空床状況',     roles:['soudan','kanri'], icon:'🛏️', tag:'入力する', desc:'在床と入退所の管理、空床状況と居室一覧表を扱います。'},
  {file:'nyusho_dashboard_main.html',    name:'入所管理ダッシュボード',   roles:['soudan','kanri'],  icon:'📊', tag:'見る',   desc:'稼働率、予算、実績見込み、進捗の一覧を見ます。'},
  {file:'jigyosho_kanri.html',           name:'事業所管理',              roles:['soudan','kanri'],  icon:'🏢', tag:'整える', desc:'事業所の登録、名寄せ、CSVとPDFからの取り込みを行います。'},
  {file:'oyake_kushou_portal.html',      name:'空床ポータル',            roles:['gaibu'],  icon:'🚪', tag:'外向け', desc:'紹介元に空床を公開し、入所の相談を受け付けます。'},
  {file:'mirai_yosouzu.html',            name:'未来予想図',              roles:['other'],  icon:'🗓️', tag:'計画',   desc:'支援相談部の目標、行事、委員会の予定を管理します。'},
  {file:'yakuzai_keisan.html',           name:'薬剤費計算ツール',         roles:['other'],  icon:'💊', tag:'計算',   desc:'薬剤費の試算を行います。'},
  {file:'top_menu.html',                 name:'QR配布（旧メニュー）',     roles:['other'],  icon:'🔳', tag:'配布',   desc:'職員室に貼るQRコードの印刷を行います。'}
];

let curRole='soudan', editMode=false, openList=[], editingFile=null;

/* ---------- 保存 ---------- */
function ls(k,def){ try{ const v=localStorage.getItem(k); return (v===null||v==='')?def:v; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function jget(k,def){ try{ return JSON.parse(ls(k,JSON.stringify(def))); }catch(e){ return def; } }
function baseUrl(){ return ls(K.base,BASE_DEFAULT); }
function layout(){ return jget(K.layout,{}); }
function custom(){ return jget(K.custom,[]); }
function multiTab(){ return ls(K.multi,'1')==='1'; }
function setLay(file,key,val){ const L=layout(); L[file]=L[file]||{}; L[file][key]=val; lsSet(K.layout,JSON.stringify(L)); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function allTools(){
  const L=layout(), C=custom();
  const list=BUILTIN.concat(C).map((t,i)=>{
    const o=Object.assign({ord:i},t,L[t.file]||{});
    o.roles=Array.isArray(o.roles)?o.roles.slice():(o.role?[o.role]:['other']);
    if(o.roles.length===0) o.roles=['other'];
    o.url=/^https?:\/\//.test(o.file)?o.file:(baseUrl()+o.file);
    o.isCustom=C.some(c=>c.file===t.file);
    return o;
  });
  list.sort((a,b)=>(a.ord-b.ord));
  return list;
}

/* ---------- 画面 ---------- */
function renderRoles(){
  const q=document.getElementById('q').value.trim();
  const all=allTools();
  document.getElementById('roles').innerHTML=ROLES.map(r=>{
    const n=all.filter(t=>t.roles.indexOf(r.id)>=0&&(editMode||!t.hidden)).length;
    return '<button class="role'+(r.id===curRole&&!q?' on':'')+'" onclick="pickRole(\''+r.id+'\')">'+r.name+'<span class="n">'+n+'</span></button>';
  }).join('');
}
function pickRole(id){
  curRole=id; lsSet(K.role,id);
  document.getElementById('q').value='';
  goHome(); renderHome();
}
function renderHome(){
  const q=document.getElementById('q').value.trim();
  const all=allTools();
  let list, lead;
  if(q){
    const k=q.toLowerCase();
    list=all.filter(t=>(t.name+t.desc+t.tag+t.file).toLowerCase().indexOf(k)>=0);
    lead='「'+esc(q)+'」で探した結果です。'+list.length+'件見つかりました。';
  } else {
    const role=ROLES.find(r=>r.id===curRole)||ROLES[0];
    list=all.filter(t=>t.roles.indexOf(curRole)>=0&&(editMode||!t.hidden));
    lead=role.desc+(editMode?'　いまは編集中です。区分は複数選べます。両方に印を付けると、どちらの画面にも出ます。':'');
  }
  let h='<div class="lead">'+lead+'</div>';

function card(t){
  return '<div class="card'+(t.hidden?' hid':'')+'"'+(editMode?'':' onclick="openTool(\''+esc(t.file)+'\')"')+'>'
    +'<div class="c-ico">'+esc(t.icon||'📄')+'</div>'
    +'<div class="c-name">'+esc(t.name)+'</div>'
    +'<div class="c-desc">'+esc(t.desc||'')+'</div>'
    +'<div class="c-foot"><span class="tag">'+esc(t.tag||'')+'</span>'
    +'<a class="ext" href="'+esc(t.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">別のタブで開く</a></div>'
    +(editMode?editRow(t):'')
    +'</div>';
}
function editRow(t){
  return '<div class="edit">'
    +ROLES.map(r=>'<label style="font-size:11px;color:#5F5E5A;margin-right:4px;"><input type="checkbox" '
        +(t.roles.indexOf(r.id)>=0?'checked':'')+' onclick="event.stopPropagation()" onchange="toggleRole(\''+esc(t.file)+'\',\''+r.id+'\',this.checked)"> '
        +r.name.replace('が使う','').replace('が見る','').replace('に見せる','')+'</label>').join('')
    +'<button class="mini" onclick="event.stopPropagation();move(\''+esc(t.file)+'\',-1)">↑</button>'
    +'<button class="mini" onclick="event.stopPropagation();move(\''+esc(t.file)+'\',1)">↓</button>'
    +'<label style="font-size:11px;color:#888780;"><input type="checkbox" '+(t.hidden?'checked':'')+' onchange="setLay(\''+esc(t.file)+'\',\'hidden\',this.checked);renderHome();"> 使わない</label>'
    +'<button class="mini" style="margin-left:auto" onclick="event.stopPropagation();openToolForm(\''+esc(t.file)+'\')">内容を直す</button>'
    +'</div>';
}
function move(file,d){
  const all=allTools();
  const me=all.find(t=>t.file===file);
  if(!me) return;
  const group=all.filter(t=>t.roles.indexOf(curRole)>=0);
  const i=group.findIndex(t=>t.file===file), j=i+d;
  if(i<0||j<0||j>=group.length) return;
  setLay(group[i].file,'ord',group[j].ord);
  setLay(group[j].file,'ord',group[i].ord);
  renderHome();
}
function toggleRole(file,role,on){
  const t=allTools().find(x=>x.file===file); if(!t) return;
  let rs=t.roles.slice();
  if(on){ if(rs.indexOf(role)<0) rs.push(role); }
  else { rs=rs.filter(r=>r!==role); }
  if(rs.length===0){ alert('区分は1つ以上選んでください'); renderHome(); return; }
  setLay(file,'roles',rs);
  renderHome();
}
function toggleEdit(){
  editMode=!editMode;
  const b=document.getElementById('editBtn');
  b.classList.toggle('on',editMode);
  b.textContent=editMode?'編集を終える':'編集';
  renderHome();
}

/* ---------- ツールを開く ---------- */
function openTool(file){
  const t=allTools().find(x=>x.file===file); if(!t) return;
  if(t.newtab){ window.open(t.url,'_blank','noopener'); return; }
  if(!multiTab()){
    openList.slice().forEach(f=>{ const el=document.getElementById('fr-'+f); if(el) el.remove(); });
    openList=[];
  }
  if(openList.indexOf(file)<0){
    openList.push(file);
    const fr=document.createElement('iframe');
    fr.className='frame'; fr.id='fr-'+file; fr.src=t.url; fr.dataset.ok='0';
    fr.addEventListener('load',()=>{ fr.dataset.ok='1'; hideBox(); });
    document.getElementById('main').appendChild(fr);
    showBox(t,'読み込んでいます','しばらくお待ちください。');
    setTimeout(()=>{
      const cur=document.querySelector('.frame.on');
      if(fr.dataset.ok!=='1' && cur===fr){
        showBox(t,'この中では開けません','アドレスが違うか、外部の画面がこの形での表示を許していない可能性があります。下のボタンから別のタブで開いてください。');
      }
    },7000);
  }
  showTool(file);
}
function showBox(t,title,msg){
  document.getElementById('fbox-name').textContent=title+'　'+t.name;
  document.getElementById('fbox-msg').textContent=msg;
  document.getElementById('fbox-open').href=t.url;
  document.getElementById('fbox').classList.add('on');
}
function hideBox(){ document.getElementById('fbox').classList.remove('on'); }
function showTool(file){
  document.getElementById('pane-home').classList.remove('on');
  document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id==='fr-'+file));
  const fr=document.getElementById('fr-'+file);
  if(fr && fr.dataset.ok==='1') hideBox();
  renderTabs(file);
}
function goHome(){
  hideBox();
  document.getElementById('pane-home').classList.add('on');
  document.querySelectorAll('.frame').forEach(f=>f.classList.remove('on'));
  renderTabs(null);
}
function closeTool(file,ev){
  if(ev) ev.stopPropagation();
  const on=document.querySelector('.frame.on');
  const wasActive=!!on && on.id==='fr-'+file;
  const fr=document.getElementById('fr-'+file); if(fr) fr.remove();
  openList=openList.filter(x=>x!==file);
  if(openList.length===0){ goHome(); return; }
  if(wasActive){ showTool(openList[openList.length-1]); return; }
  const still=document.querySelector('.frame.on');
  renderTabs(still?still.id.slice(3):null);
}
function renderTabs(active){
  const el=document.getElementById('tabs');
  el.classList.toggle('on',openList.length>0);
  if(openList.length===0){ el.innerHTML=''; return; }
  const all=allTools();
  el.innerHTML='<button class="tab-home" onclick="goHome()">🏠 ホーム</button>'
    +openList.map(f=>{
      const t=all.find(x=>x.file===f)||{name:f,icon:'📄'};
      return '<div class="tab'+(f===active?' on':'')+'" onclick="showTool(\''+esc(f)+'\')">'
        +'<span>'+esc(t.icon||'')+' '+esc(t.name)+'</span>'
        +'<span class="x" onclick="closeTool(\''+esc(f)+'\',event)">×</span></div>';
    }).join('');
}

/* ---------- ツールの追加・変更 ---------- */
function openToolForm(file){
  editingFile=file||null;
  const t=file?allTools().find(x=>x.file===file):null;
  document.getElementById('tm-title').textContent=t?'ツールの内容を直す':'ツールを追加';
  document.getElementById('tm-name').value=t?t.name:'';
  document.getElementById('tm-file').value=t?t.file:'';
  document.getElementById('tm-file').readOnly=!!t;
  const rs=t?t.roles:[curRole];
  document.getElementById('tm-roles').innerHTML=ROLES.map(r=>
    '<label style="font-size:13px;"><input type="checkbox" class="tm-r" value="'+r.id+'"'+(rs.indexOf(r.id)>=0?' checked':'')+'> '+r.name+'</label>').join('');
  document.getElementById('tm-icon').value=t?(t.icon||''):'';
  document.getElementById('tm-tag').value=t?(t.tag||''):'';
  document.getElementById('tm-desc').value=t?(t.desc||''):'';
  document.getElementById('tm-newtab').checked=!!(t&&t.newtab);
  document.getElementById('tm-del').style.display=(t&&t.isCustom)?'inline-block':'none';
  document.getElementById('ov-tool').classList.add('on');
}
function closeToolForm(){ document.getElementById('ov-tool').classList.remove('on'); editingFile=null; }
function saveTool(){
  const name=document.getElementById('tm-name').value.trim();
  const file=document.getElementById('tm-file').value.trim();
  if(!name||!file){ alert('名前とファイル名を入れてください'); return; }
  const roles=[...document.querySelectorAll('.tm-r')].filter(c=>c.checked).map(c=>c.value);
  if(roles.length===0){ alert('区分を1つ以上選んでください'); return; }
  const data={name, roles,
    icon:document.getElementById('tm-icon').value.trim()||'📄',
    tag:document.getElementById('tm-tag').value.trim(),
    desc:document.getElementById('tm-desc').value.trim(),
    newtab:document.getElementById('tm-newtab').checked};
  if(editingFile){
    Object.keys(data).forEach(k=>setLay(editingFile,k,data[k]));
  } else {
    if(allTools().some(t=>t.file===file)){ alert('同じファイル名のツールがすでにあります'); return; }
    const c=custom(); c.push(Object.assign({file},data)); lsSet(K.custom,JSON.stringify(c));
  }
  closeToolForm(); renderHome();
}
function deleteTool(){
  if(!editingFile) return;
  if(!confirm('このツールを一覧から消します。ツール本体は消えません。よろしいですか。')) return;
  lsSet(K.custom,JSON.stringify(custom().filter(c=>c.file!==editingFile)));
  const L=layout(); delete L[editingFile]; lsSet(K.layout,JSON.stringify(L));
  closeToolForm(); renderHome();
}

/* ---------- 設定 ---------- */
function openSet(){
  document.getElementById('s-base').value=baseUrl();
  document.getElementById('s-pass').value=ls(K.pass,PASS_DEFAULT);
  document.getElementById('s-multi').checked=multiTab();
  document.getElementById('ov-set').classList.add('on');
}
function closeSet(){ document.getElementById('ov-set').classList.remove('on'); }
function saveSet(){
  lsSet(K.base,document.getElementById('s-base').value.trim()||BASE_DEFAULT);
  lsSet(K.pass,document.getElementById('s-pass').value);
  lsSet(K.multi,document.getElementById('s-multi').checked?'1':'0');
  closeSet();
  openList.slice().forEach(f=>closeTool(f));
  renderHome();
}
function resetAll(){
  if(!confirm('ツールの並び、追加したツール、設定をすべて最初の状態に戻します。よろしいですか。')) return;
  [K.layout,K.custom,K.base,K.multi,K.role].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  closeSet(); location.reload();
}

/* ---------- 起動 ---------- */
function tryUnlock(){
  const pw=ls(K.pass,PASS_DEFAULT);
  if(document.getElementById('lock-in').value===pw){
    try{ sessionStorage.setItem('ooyake_unlocked','1'); }catch(e){}
    document.getElementById('lock').style.display='none';
  } else {
    document.getElementById('lock-err').textContent='パスワードが違います';
    document.getElementById('lock-in').value='';
  }
}
(function(){
  const pw=ls(K.pass,PASS_DEFAULT);
  let unlocked=false;
  try{ unlocked=sessionStorage.getItem('ooyake_unlocked')==='1'; }catch(e){}
  if(!pw||unlocked) document.getElementById('lock').style.display='none';
  curRole=ls(K.role,'soudan');
  if(!ROLES.some(r=>r.id===curRole)) curRole='soudan';
  renderHome();
})();
</script>
